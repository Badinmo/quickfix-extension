<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Kalam smoke test</title></head>
<body>
<!--
  Runs content/content.js in this page against a stubbed chrome.* API, so the
  capture → replace logic and the never-stuck rules (5 s Cancel, 20 s hard
  stop, the failure bubble) can be exercised without a browser extension
  context, an API key, or a network call. This is the test to run after
  touching content.js.

  Time is faked: setTimeout/clearTimeout are replaced with a scheduler the
  harness advances by hand, so the 5 s and 20 s cases run in milliseconds.

    & "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --headless=new `
      --disable-gpu --no-first-run --user-data-dir="$env:TEMP\qf-edge" `
      --allow-file-access-from-files --virtual-time-budget=15000 --dump-dom `
      "file:///C:/Users/motha/Projects/Extensions/New%20folder/quickfix-extension/quickfix-extension/test/smoke-test.html"

  ...or open it in a browser and read the results.
-->
<style>
  body { font: 13px/1.5 "Segoe UI", system-ui, sans-serif; padding: 20px; }
  #out { font-family: ui-monospace, Consolas, monospace; white-space: pre-wrap;
         background: #0f172a; color: #e2e8f0; padding: 12px; border-radius: 8px; }
  .fixture { position: absolute; left: -9999px; top: 0; width: 400px; }
</style>

<h1>Kalam smoke test</h1>
<pre id="out">running…</pre>

<div class="fixture" id="fixtures">
  <textarea id="ta">we was hoping you could took a look</textarea>
  <input type="text" id="inp" value="pls advise asap" />
  <div id="ce" contenteditable="true"><span id="reply">Thanks for you're email.</span><div id="quoted">QUOTED THREAD — must not change</div></div>
  <div id="ceMulti" contenteditable="true"><div id="para1">First paragraph here.</div><div id="para2"></div><div id="para3">Second paragraph here.</div></div>
  <div id="shadowHost"></div>
</div>

<script>
/* ------------------------------------------------------------ fake time */
// Installed before the content script loads. content.js calls the global
// setTimeout for the toolbar debounce, the bubble lifetimes and the 5 s / 20 s
// never-stuck timers, so all of them land in this scheduler and the harness
// decides when they fire. The stub's reply delay lands here too. Same approach
// as provider-test.html.

const realSetTimeout = window.setTimeout.bind(window);
let fakeNow = 0;
let fakeTimers = [];
let fakeSeq = 0;

window.setTimeout = (fn, ms = 0, ...args) => {
  fakeTimers.push({ id: ++fakeSeq, at: fakeNow + Math.max(0, ms), fn, args });
  return fakeSeq;
};
window.clearTimeout = (id) => {
  fakeTimers = fakeTimers.filter((t) => t.id !== id);
};

/** Let every pending promise reaction run. */
const flush = () => new Promise((r) => realSetTimeout(r, 0));

/** Advance fake time by `ms`, firing due timers in order and flushing between them. */
async function advance(ms) {
  const target = fakeNow + ms;
  await flush();
  for (;;) {
    fakeTimers.sort((a, b) => a.at - b.at || a.id - b.id);
    const next = fakeTimers[0];
    if (!next || next.at > target) break;
    fakeTimers.shift();
    fakeNow = next.at;
    next.fn(...next.args);
    await flush();
  }
  fakeNow = target;
  await flush();
}

/* ----------------------------------------------------------- chrome stub */

const listeners = [];
const storageListeners = [];
// The reply the stub sends back. The request id is echoed the way the real
// background does; a case can override it by putting its own `id` in here.
window.__reply = { ok: true, text: 'REWRITTEN' };
window.__replyDelay = 0;
window.__lastSent = null;
window.__sent = [];

window.chrome = {
  runtime: {
    id: 'smoke-test',
    onMessage: { addListener: (fn) => listeners.push(fn) },
    sendMessage: (msg) =>
      new Promise((resolve) => {
        window.__lastSent = msg;
        window.__sent.push(msg);
        if (msg.type !== 'QF_AI') return resolve({ ok: true });
        const reply = window.__reply === null ? null : { id: msg.id, ...window.__reply };
        setTimeout(() => resolve(reply), window.__replyDelay);
      })
  },
  storage: {
    local: { get: () => Promise.resolve({}) },
    onChanged: { addListener: (fn) => storageListeners.push(fn) }
  }
};

/** Change a setting the way the options page would: through storage.onChanged. */
function setSetting(key, newValue) {
  for (const fn of storageListeners) fn({ [key]: { newValue } }, 'local');
}

/* ---------------------------------------------------- load content script */

const src = (() => {
  const xhr = new XMLHttpRequest();
  xhr.open('GET', '../content/content.js', false);
  xhr.send(null);
  return xhr.responseText;
})();
new Function(src)();

/* ------------------------------------------------------------- test rig */

const results = [];
/** Wait `ms` of fake time. */
const wait = (ms) => advance(ms);

function check(name, pass, detail) {
  results.push(`${pass ? 'PASS' : 'FAIL'}  ${name}${pass || !detail ? '' : '\n        ' + detail}`);
}

/** Deliver an action the way the background worker would. */
function invoke(action) {
  for (const fn of listeners) fn({ type: 'QF_RUN', action, source: 'menu' }, {}, () => {});
}

const $ = (id) => document.getElementById(id);

function selectIn(node, start, end) {
  const range = document.createRange();
  range.setStart(node, start);
  range.setEnd(node, end);
  const sel = getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  return range;
}

/* ----------------------------------------------------------------- tests */

async function main() {
  // 1 — textarea with no selection rewrites the whole field.
  const ta = $('ta');
  ta.focus();
  ta.setSelectionRange(0, 0);
  window.__reply = { ok: true, text: 'We were hoping you could take a look' };
  invoke('grammar');
  await wait(150);
  check('textarea, no selection → whole field rewritten',
    ta.value === 'We were hoping you could take a look', `value = ${JSON.stringify(ta.value)}`);
  check('textarea → only the selected text was sent',
    window.__lastSent?.text === 'we was hoping you could took a look',
    `sent = ${JSON.stringify(window.__lastSent?.text)}`);

  // 2 — partial selection in a textarea leaves the rest alone.
  ta.value = 'keep this. fix this bit. keep this too.';
  ta.focus();
  ta.setSelectionRange(11, 23); // "fix this bit"
  window.__reply = { ok: true, text: 'FIXED' };
  invoke('grammar');
  await wait(150);
  check('textarea, partial selection → surrounding text untouched',
    ta.value === 'keep this. FIXED. keep this too.', `value = ${JSON.stringify(ta.value)}`);

  // 3 — single-line input must never receive a newline.
  const inp = $('inp');
  inp.focus();
  inp.setSelectionRange(0, inp.value.length);
  window.__reply = { ok: true, text: 'first line\nsecond line' };
  invoke('grammar');
  await wait(150);
  check('input → newlines collapsed to spaces',
    inp.value === 'first line second line', `value = ${JSON.stringify(inp.value)}`);

  // 4 — leading/trailing whitespace in the selection is preserved.
  ta.value = 'alpha  beta  gamma';
  ta.focus();
  ta.setSelectionRange(5, 13); // "  beta  " with the spaces either side
  window.__reply = { ok: true, text: 'BETA' };
  invoke('grammar');
  await wait(150);
  check('whitespace around the selection is preserved',
    ta.value === 'alpha  BETA  gamma', `value = ${JSON.stringify(ta.value)}`);
  check('whitespace was trimmed before sending',
    window.__lastSent?.text === 'beta', `sent = ${JSON.stringify(window.__lastSent?.text)}`);

  // 5 — contenteditable: replace the selection, leave the quoted thread alone.
  const reply = $('reply').firstChild;
  $('ce').focus();
  selectIn(reply, 0, reply.length);
  window.__reply = { ok: true, text: 'Thank you for your email.' };
  invoke('grammar');
  await wait(150);
  check('contenteditable → selection replaced',
    $('ce').textContent.includes('Thank you for your email.'),
    `text = ${JSON.stringify($('ce').textContent)}`);
  check('contenteditable → quoted thread untouched',
    $('quoted').textContent === 'QUOTED THREAD — must not change');
  check('contenteditable → only the selection was sent',
    window.__lastSent?.text === "Thanks for you're email.",
    `sent = ${JSON.stringify(window.__lastSent?.text)}`);

  // 5b — a selection spanning multiple paragraphs (separate block elements,
  // as contenteditable represents each line/paragraph) must not be falsely
  // flagged as "changed" by the staleness re-check. Regression test for a
  // real bug: the check used to compare Selection.toString() (captured at
  // selection time, which inserts line breaks between paragraphs) against
  // Range.toString() (re-checked later, which per spec only concatenates
  // text-node data with no line breaks) — those two disagreed on ANY
  // multi-paragraph selection even when nothing on the page had changed.
  const p1 = $('para1').firstChild;
  const p3 = $('para3').firstChild;
  const multiRange = document.createRange();
  multiRange.setStart(p1, 0);
  multiRange.setEnd(p3, p3.length);
  $('ceMulti').focus();
  const multiSel = getSelection();
  multiSel.removeAllRanges();
  multiSel.addRange(multiRange);
  window.__reply = { ok: true, text: 'REPLACED MULTI PARAGRAPH TEXT' };
  window.__lastSent = null;
  invoke('grammar');
  await wait(150);
  check('multi-paragraph selection → not falsely flagged as changed',
    $('ceMulti').textContent.includes('REPLACED MULTI PARAGRAPH TEXT'),
    `text = ${JSON.stringify($('ceMulti').textContent)}`);

  // 6 — no selection in a contenteditable must NOT grab the whole box.
  getSelection().removeAllRanges();
  $('ce').focus();
  const ceBefore = $('ce').textContent;
  window.__lastSent = null;
  window.__reply = { ok: true, text: 'SHOULD NOT APPEAR' };
  invoke('grammar');
  await wait(150);
  check('contenteditable, no selection → nothing sent, nothing changed',
    window.__lastSent === null && $('ce').textContent === ceBefore,
    `sent = ${JSON.stringify(window.__lastSent)}`);
  const selectFirst = document.querySelector('[data-quickfix]')?.shadowRoot?.querySelector('.card')?.textContent || '';
  check('contenteditable, no selection → "select first" bubble, no Retry (nothing to retry on)',
    /Select the text/.test(selectFirst) && !/Retry/.test(selectFirst), `bubble = ${JSON.stringify(selectFirst)}`);

  // 7 — the field changing mid-flight aborts the replacement.
  ta.value = 'original text here';
  ta.focus();
  ta.setSelectionRange(0, ta.value.length);
  window.__replyDelay = 250;
  window.__reply = { ok: true, text: 'STALE WRITE' };
  invoke('grammar');
  await wait(60);
  ta.value = 'user typed something else';   // simulate the user carrying on
  await wait(400);
  window.__replyDelay = 0;
  check('stale target → replacement refused',
    ta.value === 'user typed something else', `value = ${JSON.stringify(ta.value)}`);
  const staleBubble = document.querySelector('[data-quickfix]')?.shadowRoot?.querySelector('.card')?.textContent || '';
  check('stale target → bubble says the field changed, with Retry',
    /changed while/.test(staleBubble) && /Retry/.test(staleBubble), `bubble = ${JSON.stringify(staleBubble)}`);

  // 8 — API errors surface instead of writing junk into the field.
  ta.value = 'unchanged on error';
  ta.focus();
  ta.setSelectionRange(0, ta.value.length);
  window.__reply = { ok: false, code: 'RATE_LIMIT', error: 'Gemini rate limit hit.' };
  invoke('grammar');
  await wait(150);
  check('API error → field untouched',
    ta.value === 'unchanged on error', `value = ${JSON.stringify(ta.value)}`);
  const shadowHost = document.querySelector('[data-quickfix]');
  const bubbleText = shadowHost?.shadowRoot?.textContent || '';
  check('API error → message shown to the user',
    bubbleText.includes('rate limit'), `bubble = ${JSON.stringify(bubbleText)}`);

  // 9 — floating toolbar appears for an editable selection.
  window.__reply = { ok: true, text: 'x' };
  const q = $('quoted').firstChild;
  $('ce').focus();
  selectIn(q, 0, 6);
  $('ce').dispatchEvent(new MouseEvent('mouseup', { bubbles: true, composed: true }));
  await wait(400);
  const bar = document.querySelector('[data-quickfix]')?.shadowRoot?.querySelector('.bar');
  check('floating toolbar shown on editable selection', !!bar);
  check('toolbar offers both actions',
    !!bar && /Fix grammar/.test(bar.textContent) && /Translate/.test(bar.textContent),
    `toolbar = ${JSON.stringify(bar?.textContent)}`);

  // 10 — read-only selection is never written to, result offered for copy.
  getSelection().removeAllRanges();
  const ro = document.createElement('p');
  ro.textContent = 'plain page text, not editable';
  document.getElementById('fixtures').appendChild(ro);
  selectIn(ro.firstChild, 0, ro.firstChild.length);
  window.__reply = { ok: true, text: 'TRANSLATED' };
  invoke('translate');
  await wait(200);
  const panel = document.querySelector('[data-quickfix]')?.shadowRoot?.querySelector('.panel');
  check('read-only selection → page text not modified',
    ro.textContent === 'plain page text, not editable');
  check('read-only selection → result offered in a panel',
    !!panel && panel.textContent.includes('TRANSLATED'),
    `panel = ${JSON.stringify(panel?.textContent)}`);

  /* ------------------------------------------------ never-stuck rules */

  const shadow = () => document.querySelector('[data-quickfix]')?.shadowRoot;
  /** Everything currently rendered in the shadow root, minus its stylesheet. */
  const shadowText = () =>
    [...(shadow()?.children || [])].filter((c) => c.tagName !== 'STYLE').map((c) => c.textContent).join('');
  /** A button the user could see, found by its label rather than its class. */
  const buttonNamed = (label) =>
    [...(shadow()?.querySelectorAll('button') || [])].find((b) => b.textContent.trim() === label) || null;
  /** The bubble currently showing `text`, if any. */
  const bubbleWith = (text) =>
    [...(shadow()?.querySelectorAll('.card') || [])].find((c) => c.textContent.includes(text)) || null;
  /** Put `value` in the textarea, select all of it and start an action. */
  function startOnTextarea(action, value) {
    getSelection().removeAllRanges();
    ta.value = value;
    ta.focus();
    ta.setSelectionRange(0, ta.value.length);
    window.__lastSent = null;
    invoke(action);
  }

  // 11 — a reply that has not arrived by 5 s: the indicator offers Cancel.
  window.__replyDelay = 6000;
  window.__reply = { ok: true, text: 'LATE' };
  startOnTextarea('grammar', 'slow request text');
  await wait(4999);
  check('before 5 s → no Cancel button yet', !buttonNamed('Cancel'), `shadow = ${JSON.stringify(shadowText())}`);
  await wait(1);
  check('at 5 s → indicator reads "Still working…" and offers Cancel',
    /Still working/.test(shadowText()) && !!buttonNamed('Cancel'), `shadow = ${JSON.stringify(shadowText())}`);

  // 12 — Cancel: indicator gone at once, the late reply is dropped, the field
  // is untouched, and the extension is not left busy.
  buttonNamed('Cancel')?.click();
  await wait(0);
  check('Cancel → indicator hidden immediately',
    !buttonNamed('Cancel') && !/Still working|Fixing/.test(shadowText()), `shadow = ${JSON.stringify(shadowText())}`);
  await wait(2000); // the reply lands at 6 s
  check('Cancel → late reply dropped, field untouched', ta.value === 'slow request text', `value = ${JSON.stringify(ta.value)}`);
  window.__replyDelay = 0;
  window.__reply = { ok: true, text: 'SECOND ACTION WORKED' };
  startOnTextarea('grammar', 'second attempt');
  await wait(50);
  check('Cancel → a new action starts straight away', ta.value === 'SECOND ACTION WORKED', `value = ${JSON.stringify(ta.value)}`);

  // 13 — a reply that never arrives: hard stop at 20 s with a bubble and Retry.
  window.__replyDelay = Infinity;
  window.__reply = { ok: true, text: 'NEVER' };
  startOnTextarea('grammar', 'dead request text');
  await wait(19999);
  check('before 20 s → still working, no Retry', !!buttonNamed('Cancel') && !buttonNamed('Retry'),
    `shadow = ${JSON.stringify(shadowText())}`);
  await wait(1);
  check('at 20 s → timed-out bubble with Retry, indicator gone',
    /took too long/i.test(shadowText()) && !!buttonNamed('Retry') && !buttonNamed('Cancel'),
    `shadow = ${JSON.stringify(shadowText())}`);
  check('at 20 s → field untouched', ta.value === 'dead request text', `value = ${JSON.stringify(ta.value)}`);
  window.__replyDelay = 0;
  window.__reply = { ok: true, text: 'AFTER TIMEOUT' };
  startOnTextarea('grammar', 'after the timeout');
  await wait(50);
  check('timed out → busy cleared, a new action works', ta.value === 'AFTER TIMEOUT', `value = ${JSON.stringify(ta.value)}`);

  // 14 — every failure code ends in a bubble with the message and Retry;
  // only the key/model codes also offer Open settings.
  const SETTINGS_CODES = ['NO_API_KEY', 'BAD_KEY', 'BAD_MODEL'];
  const OTHER_CODES = ['RATE_LIMIT', 'NETWORK', 'TIMEOUT', 'SERVER', 'BLOCKED', 'UNKNOWN'];
  for (const code of [...SETTINGS_CODES, ...OTHER_CODES]) {
    window.__reply = { ok: false, code, error: `readable message for ${code}` };
    startOnTextarea('grammar', `text for ${code}`);
    await wait(50);
    const wantSettings = SETTINGS_CODES.includes(code);
    check(`${code} → bubble with the message, Retry${wantSettings ? ' and Open settings' : ', no Open settings'}`,
      shadowText().includes(`readable message for ${code}`) && !!buttonNamed('Retry') &&
        !!buttonNamed('Open settings') === wantSettings && ta.value === `text for ${code}`,
      `shadow = ${JSON.stringify(shadowText())}, value = ${JSON.stringify(ta.value)}`);
  }

  // 15 — Retry re-runs the same action on the same captured target, even
  // though the user has since focused another field.
  getSelection().removeAllRanges();
  ta.value = 'keep. retry this bit. keep.';
  ta.focus();
  ta.setSelectionRange(6, 20); // "retry this bit"
  window.__reply = { ok: false, code: 'NETWORK', error: 'Could not reach the provider.' };
  window.__sent = [];
  invoke('translate');
  await wait(50);
  const firstRequest = window.__lastSent;
  inp.focus();
  inp.setSelectionRange(0, inp.value.length); // a re-capture would now pick this field
  window.__reply = { ok: true, text: 'RETRIED' };
  buttonNamed('Retry')?.click();
  await wait(50);
  const retryRequest = window.__lastSent;
  check('Retry → re-sends the same action and the same text',
    window.__sent.length === 2 && retryRequest?.action === 'translate' && retryRequest?.text === 'retry this bit',
    `sent = ${JSON.stringify(window.__sent)}`);
  check('Retry → a fresh request id', retryRequest?.id !== undefined && retryRequest.id !== firstRequest?.id,
    `ids = ${firstRequest?.id}, ${retryRequest?.id}`);
  check('Retry → writes to the original target, not the newly focused field',
    ta.value === 'keep. RETRIED. keep.' && inp.value === 'first line second line',
    `ta = ${JSON.stringify(ta.value)}, inp = ${JSON.stringify(inp.value)}`);
  check('Retry → the failure bubble is gone', !buttonNamed('Retry'), `shadow = ${JSON.stringify(shadowText())}`);

  // 16 — a failure bubble never auto-dismisses; each of Escape, a click on it,
  // a scroll and a new action dismisses it. A success flash is short-lived.
  async function failWith(message) {
    window.__reply = { ok: false, code: 'SERVER', error: message };
    startOnTextarea('grammar', 'bubble dismissal text');
    await wait(50);
    return shadowText().includes(message);
  }
  let shown = await failWith('persistent failure');
  await wait(60 * 60 * 1000);
  check('failure bubble → still there an hour later', shown && shadowText().includes('persistent failure'),
    `shadow = ${JSON.stringify(shadowText())}`);
  document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  check('failure bubble → dismissed by Escape', !shadowText().includes('persistent failure'), `shadow = ${JSON.stringify(shadowText())}`);

  shown = await failWith('click me away');
  bubbleWith('click me away')?.click(); // the bubble itself, not a button
  check('failure bubble → dismissed by a click on it', shown && !shadowText().includes('click me away'),
    `shadow = ${JSON.stringify(shadowText())}`);

  shown = await failWith('scroll me away');
  document.dispatchEvent(new Event('scroll'));
  check('failure bubble → dismissed by a scroll', shown && !shadowText().includes('scroll me away'),
    `shadow = ${JSON.stringify(shadowText())}`);

  shown = await failWith('replaced by a new action');
  window.__reply = { ok: true, text: 'NEW ACTION DONE' };
  startOnTextarea('grammar', 'new action text');
  await wait(50);
  check('failure bubble → dismissed by a new action', shown && !shadowText().includes('replaced by a new action'),
    `shadow = ${JSON.stringify(shadowText())}`);
  const flashShown = shadowText().includes('Fixed');
  await wait(2000);
  check('success flash → shown, then gone within 2 s', flashShown && !shadowText().includes('Fixed'),
    `shown = ${flashShown}, shadow = ${JSON.stringify(shadowText())}`);

  // 17 — showIndicator off hides the working state only: Cancel still comes
  // at 5 s (never-stuck is a guarantee, not a progress pill) and failures
  // still end in the bubble.
  setSetting('showIndicator', false);
  window.__replyDelay = 6000;
  window.__reply = { ok: false, code: 'SERVER', error: 'failed with the indicator off' };
  startOnTextarea('grammar', 'indicator off text');
  await wait(4999);
  check('showIndicator off → no working indicator', !/Fixing/.test(shadowText()), `shadow = ${JSON.stringify(shadowText())}`);
  await wait(1);
  check('showIndicator off → Cancel still offered at 5 s', !!buttonNamed('Cancel'), `shadow = ${JSON.stringify(shadowText())}`);
  await wait(1000);
  check('showIndicator off → failure still ends in the bubble with Retry',
    shadowText().includes('failed with the indicator off') && !!buttonNamed('Retry'), `shadow = ${JSON.stringify(shadowText())}`);
  setSetting('showIndicator', true);
  window.__replyDelay = 0;

  // 18 — the success flash says when the replacement came from on-device.
  window.__reply = { ok: true, text: 'محلي', via: 'on-device' };
  startOnTextarea('translate', 'local translate text');
  await wait(50);
  check('via on-device → flash reads "Translated · on-device"',
    ta.value === 'محلي' && /Translated · on-device/.test(shadowText()), `shadow = ${JSON.stringify(shadowText())}`);
  await wait(2000);
  window.__reply = { ok: true, text: 'cloud', via: 'gemini' };
  startOnTextarea('translate', 'cloud translate text');
  await wait(50);
  check('via gemini → plain "Translated" flash',
    /Translated/.test(shadowText()) && !/on-device/.test(shadowText()), `shadow = ${JSON.stringify(shadowText())}`);
  await wait(2000);

  // 19 — a reply carrying some other request's id is dropped: nothing is
  // written, the request stays in flight, and the 20 s stop still ends it.
  window.__reply = { ok: true, text: 'STALE REPLY', id: 'some-other-request' };
  startOnTextarea('grammar', 'stale id text');
  await wait(50);
  check('stale-id reply → dropped, field untouched, still working',
    ta.value === 'stale id text' && /Fixing/.test(shadowText()) && !buttonNamed('Retry'),
    `value = ${JSON.stringify(ta.value)}, shadow = ${JSON.stringify(shadowText())}`);
  await wait(20000);
  check('stale-id reply → the action still ends in the timed-out bubble',
    ta.value === 'stale id text' && /took too long/i.test(shadowText()) && !!buttonNamed('Retry'),
    `value = ${JSON.stringify(ta.value)}, shadow = ${JSON.stringify(shadowText())}`);
  document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));

  const failed = results.filter((r) => r.startsWith('FAIL')).length;
  document.getElementById('out').textContent =
    results.join('\n') + `\n\n${results.length - failed}/${results.length} passed` +
    (failed ? `  — ${failed} FAILED` : '  — all good');
  document.title = failed ? `FAILED ${failed}` : 'ALL PASS';
}

main().catch((err) => {
  document.getElementById('out').textContent =
    'harness crashed: ' + err.message + '\n' + err.stack + '\n\n' + results.join('\n');
  document.title = 'HARNESS CRASH';
});
</script>
</body>
</html>
