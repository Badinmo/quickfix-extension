<!--
  Drives lib/ai.js (the provider seam) against a stubbed fetch and a stubbed
  chrome.storage.local, so runAction's result object, its error codes, what it
  sends to Gemini and what it remembers in storage — and listModels' live list,
  its 24 h cache and the BAD_MODEL self-heal — can all be checked without a
  key, a network, or an extension context. This is the test to run after
  touching lib/ai.js or lib/config.js.

  Time is faked: setTimeout/clearTimeout are replaced with a scheduler the
  harness advances by hand, so the 20 s hard stop is tested in milliseconds.

    & "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --headless=new `
      --disable-gpu --no-first-run --user-data-dir="$env:TEMP\qf-edge" `
      --allow-file-access-from-files --virtual-time-budget=10000 --dump-dom `
      "file:///C:/Users/motha/Projects/Extensions/New%20folder/quickfix-extension/quickfix-extension/test/provider-test.html"

  ...or open it in a browser and read the results (needs a browser that allows
  ES modules from file://, which is what --allow-file-access-from-files does).
-->

<script>
/* ------------------------------------------------------------ fake time */
// Installed before the module loads. ai.js calls the global setTimeout, so
// its deadline lands in this scheduler and the harness decides when it fires.

const realSetTimeout = window.setTimeout.bind(window);
let fakeNow = 0;
let fakeTimers = [];
let fakeSeq = 0;

window.setTimeout = (fn, ms = 0, ...args) => {
  fakeTimers.push({ id: ++fakeSeq, at: fakeNow + Math.max(0, ms), fn, args });
  return fakeSeq;
};
window.clearTimeout = (id) => {
  fakeTimers = fakeTimers.filter((t) => t.id !== id);
};

/** Let every pending promise reaction run. */
const flush = () => new Promise((r) => realSetTimeout(r, 0));

/** Advance fake time by `ms`, firing due timers in order and flushing between them. */
async function advance(ms) {
  const target = fakeNow + ms;
  await flush(); // let work already queued (e.g. a storage read before the fetch) register its timers first
  for (;;) {
    fakeTimers.sort((a, b) => a.at - b.at || a.id - b.id);
    const next = fakeTimers[0];
    if (!next || next.at > target) break;
    fakeTimers.shift();
    fakeNow = next.at;
    next.fn(...next.args);
    await flush();
  }
  fakeNow = target;
  await flush();
}

/* ---------------------------------------------------------- chrome stub */

window.__storage = {};
window.chrome = {
  storage: {
    local: {
      get: (keys) => {
        const out = {};
        if (typeof keys === 'string') keys = [keys];
        if (Array.isArray(keys)) {
          for (const k of keys) if (k in window.__storage) out[k] = window.__storage[k];
        } else if (keys && typeof keys === 'object') {
          for (const k of Object.keys(keys)) out[k] = k in window.__storage ? window.__storage[k] : keys[k];
        } else {
          Object.assign(out, window.__storage);
        }
        return Promise.resolve(JSON.parse(JSON.stringify(out)));
      },
      set: (patch) => {
        Object.assign(window.__storage, JSON.parse(JSON.stringify(patch)));
        return Promise.resolve();
      }
    }
  }
};

/* ----------------------------------------------------------- fetch stub */
// Each call to fetch takes the next scripted response off the queue. A script
// entry is a function (url, init) => Promise<Response>. What was sent is
// recorded in __fetches as { url, headers, body (parsed), signal }.

window.__fetches = [];
let fetchScript = [];

const abortError = () => new DOMException('The user aborted a request.', 'AbortError');

window.fetch = (url, init = {}) => {
  let body = null;
  try { body = JSON.parse(init.body); } catch { /* not JSON */ }
  window.__fetches.push({ url: String(url), headers: init.headers || {}, body, signal: init.signal });
  const next = fetchScript.shift();
  if (!next) return Promise.reject(new Error('harness: no scripted response left for fetch'));
  return next(url, init);
};

/** Wait `ms` of fake time, then settle with `result`; rejects with AbortError if the signal fires first. */
function after(ms, result) {
  return (_url, init) =>
    new Promise((resolve, reject) => {
      const signal = init.signal;
      if (signal?.aborted) return reject(abortError());
      const timer = setTimeout(() => {
        if (signal?.aborted) return;
        result instanceof Error ? reject(result) : resolve(result);
      }, ms);
      signal?.addEventListener('abort', () => { clearTimeout(timer); reject(abortError()); });
    });
}

/** A fetch that never settles on its own — only an abort ends it. */
const never = () => after(Infinity, null);

/**
 * The parts of a Response the provider reads. A plain object rather than a real
 * Response so json() settles in a microtask and fake time stays deterministic.
 * No payload means a non-JSON body: json() rejects, as the real one would.
 */
const http = (status, payload) => ({
  ok: status >= 200 && status < 300,
  status,
  json: () => (payload === undefined ? Promise.reject(new SyntaxError('not JSON')) : Promise.resolve(payload))
});

const reply = (text, extra = {}) =>
  http(200, { candidates: [{ content: { parts: [{ text }] }, finishReason: 'STOP', ...extra }] });

const networkFailure = () => new TypeError('Failed to fetch');

function script(...responses) {
  fetchScript = responses.map((r) => (typeof r === 'function' ? r : after(0, r)));
}

/* ------------------------------------------------------------- test rig */

const results = [];
function check(name, pass, detail) {
  results.push(`${pass ? 'PASS' : 'FAIL'}  ${name}${pass || !detail ? '' : '\n        ' + detail}`);
  // Written as we go, so a case that hangs still leaves the earlier results visible.
  document.getElementById('out').textContent = results.join('\n') + '\n\nrunning…';
}

function reset() {
  window.__storage = {};
  window.__fetches = [];
  fetchScript = [];
  fakeTimers = [];
  fakeNow = 0;
}

/** Run runAction to completion, driving fake time, and return { value } or { error }. */
async function run(runAction, action, text, settings) {
  let outcome = null;
  const p = runAction(action, text, settings).then(
    (value) => { outcome = { value }; },
    (error) => { outcome = { error }; }
  );
  // Scripted responses settle at fake time 0 unless a case says otherwise;
  // advancing past the deadline guarantees termination either way.
  for (let i = 0; i < 20 && !outcome; i++) await advance(5000);
  await p;
  return outcome;
}

const SETTINGS = {
  apiKey: 'test-key',
  model: 'gemini-test-model',
  targetLanguage: 'Arabic',
  secondaryLanguage: 'English',
  autoSwapLanguage: true,
  tone: 'preserve',
  customInstructions: ''
};

const pendingTimers = () => fakeTimers.length;
const now = () => fakeNow;

window.__harness = { advance, now, pendingTimers, check, reset, run, script, after, never, abortError, http, reply, networkFailure, SETTINGS, results };
</script>

<script type="module">
import { runAction, listModels, validateKey, AiError } from '../lib/ai.js';
import { getSettings, MAX_CHARS, MODELS } from '../lib/config.js';
import { runNeverStuck } from '../lib/never-stuck.js';

const H = window.__harness;
const { check, reset, script, reply, http, after, never, abortError, networkFailure, SETTINGS, results } = H;
const run = (action, text, settings = SETTINGS) => H.run(runAction, action, text, settings);
/** Run listModels to completion, driving fake time, and return { value } or { error }. */
const list = (settings = SETTINGS, opts) => H.run((s, o) => listModels(s, o), settings, opts);
const lastBody = () => window.__fetches[window.__fetches.length - 1]?.body;

/** A Gemini models-list entry as the API shapes it. */
const gm = (name, displayName, methods = ['generateContent'], extra = {}) =>
  ({ name: `models/${name}`, displayName, supportedGenerationMethods: methods, ...extra });
const modelsPage = (models, nextPageToken) => http(200, nextPageToken ? { models, nextPageToken } : { models });
const ids = (models) => (models || []).map((m) => m.id);

async function main() {
  // 1 — result shape.
  reset();
  script(reply('We were hoping you could take a look.'));
  let r = await run('grammar', 'we was hoping you could took a look.');
  check('runAction resolves to { text, via: "gemini" }',
    r.value && r.value.text === 'We were hoping you could take a look.' && r.value.via === 'gemini',
    `got ${JSON.stringify(r.value ?? r.error?.message)}`);
  check('a successful action clears its deadline timer', H.pendingTimers() === 0, `pending = ${H.pendingTimers()}`);

  // 2 — the 20 s hard stop is one budget for the whole action, not one per
  // thinking-variant attempt. Three variants are rejected (5 s each), then the
  // fourth request hangs: the action must abort at 20 s from the start, not at
  // 15 s + a fresh timeout.
  reset();
  const invalid = () => http(400, { error: { message: 'Unknown name "thinkingLevel"' } });
  script(after(5000, invalid()), after(5000, invalid()), after(5000, invalid()), never());
  let outcome = null;
  const pending = runAction('grammar', 'hello there', SETTINGS).then(
    (value) => { outcome = { value }; },
    (error) => { outcome = { error }; }
  );
  await H.advance(19999);
  check('never-resolving fetch → still pending at 19.999 s', outcome === null,
    `outcome = ${JSON.stringify(outcome?.error?.code ?? outcome?.value)}`);
  await H.advance(1);
  const settledAt20 = outcome !== null;
  if (!settledAt20) await H.advance(600000); // let a wrong (longer) timeout fire so the harness still finishes
  await pending;
  check('never-resolving fetch → TIMEOUT at 20 s of fake time, after 3 variant attempts',
    settledAt20 && outcome?.error instanceof AiError && outcome.error.code === 'TIMEOUT' && window.__fetches.length === 4,
    `settled at 20 s = ${settledAt20}, code = ${outcome?.error?.code}, fetches = ${window.__fetches.length}`);
  check('TIMEOUT message is worded for the user',
    /took too long/i.test(outcome?.error?.message || '') && !/gemini/i.test(outcome?.error?.message || ''),
    `message = ${JSON.stringify(outcome?.error?.message)}`);
  check('TIMEOUT leaves no timer behind', H.pendingTimers() === 0, `pending = ${H.pendingTimers()}`);

  // 3 — headers arrive but the body never finishes: still TIMEOUT, not a
  // misreported empty response.
  reset();
  script((_url, init) => Promise.resolve({
    ok: true,
    status: 200,
    json: () => new Promise((_, reject) => init.signal.addEventListener('abort', () => reject(abortError())))
  }));
  r = await run('grammar', 'hello there');
  check('body that never finishes → TIMEOUT at 20 s', r.error?.code === 'TIMEOUT',
    `got ${r.error?.code}: ${r.error?.message}`);

  /** Script the responses, run one grammar action, and expect an AiError with `code`. */
  async function expectError(name, responses, code, { text = 'some text', settings = SETTINGS, fetches } = {}) {
    reset();
    script(...responses);
    const out = await run('grammar', text, settings);
    const err = out.error;
    const pass = err instanceof AiError && err.code === code &&
      (fetches === undefined || window.__fetches.length === fetches);
    check(name, pass,
      `got ${err ? `${err.code}: ${err.message}` : JSON.stringify(out.value)}; fetches = ${window.__fetches.length}`);
    return err;
  }

  // 4 — HTTP status → error code, unchanged from before this harness existed.
  await expectError('400 mentioning the API key → BAD_KEY, no retry',
    [http(400, { error: { message: 'API key not valid. Please pass a valid API key.' } })], 'BAD_KEY', { fetches: 1 });
  await expectError('400 for anything else → INVALID_ARGUMENT after every variant is tried',
    Array(6).fill(0).map(() => http(400, { error: { message: 'Unknown name "thinkingLevel"' } })), 'INVALID_ARGUMENT', { fetches: 6 });
  await expectError('401 → BAD_KEY', [http(401, {})], 'BAD_KEY', { fetches: 1 });
  await expectError('403 → BAD_KEY', [http(403, { error: { message: 'PERMISSION_DENIED' } })], 'BAD_KEY', { fetches: 1 });
  // A 404 also triggers the one list refresh of the self-heal (section 17); with
  // no list to be had, the original code surfaces.
  await expectError('404 → BAD_MODEL (after the one list refresh)',
    [http(404, { error: { message: 'model not found' } }), http(500)], 'BAD_MODEL', { fetches: 2 });
  await expectError('429 → RATE_LIMIT', [http(429, { error: { message: 'quota' } })], 'RATE_LIMIT', { fetches: 1 });
  await expectError('500 → SERVER', [http(500)], 'SERVER', { fetches: 1 });
  await expectError('503 → SERVER', [http(503, { error: { message: 'overloaded' } })], 'SERVER', { fetches: 1 });
  await expectError('418 (unmapped) → HTTP_418', [http(418, {})], 'HTTP_418', { fetches: 1 });
  await expectError('fetch throws → NETWORK, no retry', [after(0, networkFailure())], 'NETWORK', { fetches: 1 });
  check('a failed action clears its deadline timer', H.pendingTimers() === 0, `pending = ${H.pendingTimers()}`);

  // 5 — 200 responses that are not usable.
  await expectError('promptFeedback.blockReason → BLOCKED',
    [http(200, { promptFeedback: { blockReason: 'SAFETY' }, candidates: [] })], 'BLOCKED');
  await expectError('finishReason SAFETY → BLOCKED', [reply('partial', { finishReason: 'SAFETY' })], 'BLOCKED');
  await expectError('finishReason PROHIBITED_CONTENT → BLOCKED', [reply('partial', { finishReason: 'PROHIBITED_CONTENT' })], 'BLOCKED');
  const truncated = await expectError('finishReason MAX_TOKENS with text → TRUNCATED',
    [reply('cut off mid', { finishReason: 'MAX_TOKENS' })], 'TRUNCATED');
  check('TRUNCATED with text explains the selection is too long', /too long/.test(truncated?.message || ''), truncated?.message);
  const thoughtOut = await expectError('finishReason MAX_TOKENS with no text → TRUNCATED',
    [http(200, { candidates: [{ content: { parts: [] }, finishReason: 'MAX_TOKENS' }] })], 'TRUNCATED');
  check('TRUNCATED with no text blames the thinking budget', /thinking/.test(thoughtOut?.message || ''), thoughtOut?.message);
  await expectError('no candidates → EMPTY_RESPONSE', [http(200, { candidates: [] })], 'EMPTY_RESPONSE');
  await expectError('non-JSON 200 body → EMPTY_RESPONSE', [http(200)], 'EMPTY_RESPONSE');
  await expectError('candidate with only whitespace → EMPTY_RESPONSE', [reply('  \n ')], 'EMPTY_RESPONSE');

  // 6 — pre-checks that never reach the network.
  await expectError('no API key → NO_API_KEY, nothing fetched', [reply('x')], 'NO_API_KEY',
    { settings: { ...SETTINGS, apiKey: '' }, fetches: 0 });
  await expectError('empty text → EMPTY, nothing fetched', [reply('x')], 'EMPTY', { text: '   \n', fetches: 0 });
  await expectError('text over MAX_CHARS → TOO_LONG, nothing fetched', [reply('x')], 'TOO_LONG',
    { text: 'a'.repeat(MAX_CHARS + 1), fetches: 0 });
  reset();
  script(reply('ok'));
  r = await run('grammar', 'a'.repeat(MAX_CHARS));
  check('text exactly MAX_CHARS is sent', r.value?.text === 'ok' && window.__fetches.length === 1, JSON.stringify(r.error?.code));

  // 7 — what is sent.
  reset();
  script(reply('ok'));
  r = await run('translate', 'hello', { ...SETTINGS, model: 'gemini-x/y', apiKey: 'KEY-123', targetLanguage: 'French' });
  const sent = window.__fetches[0];
  check('request goes to the model in settings, URL-encoded',
    sent?.url === 'https://generativelanguage.googleapis.com/v1beta/models/gemini-x%2Fy:generateContent', sent?.url);
  check('key travels in the x-goog-api-key header, not the URL',
    sent?.headers['x-goog-api-key'] === 'KEY-123' && !sent.url.includes('KEY-123'), JSON.stringify(sent?.headers));
  check('the selection is the only user content, fenced by the sentinels',
    sent?.body?.contents?.length === 1 && sent.body.contents[0].parts[0].text.includes('<<<TEXT\nhello\nTEXT>>>'),
    JSON.stringify(sent?.body?.contents));
  check('translate builds a system instruction naming the target language',
    /French/.test(sent?.body?.systemInstruction?.parts?.[0]?.text || ''));
  check('translate uses the lower temperature', sent?.body?.generationConfig?.temperature === 0.2,
    JSON.stringify(sent?.body?.generationConfig));

  // 8 — thought parts never reach the document.
  reset();
  script(http(200, { candidates: [{ content: { parts: [
    { thought: true, text: 'Let me reason about this…' }, { text: 'Clean answer' }
  ] }, finishReason: 'STOP' }] }));
  r = await run('grammar', 'dirty answer');
  check('parts flagged thought are filtered out', r.value?.text === 'Clean answer', JSON.stringify(r.value ?? r.error?.message));

  // 9 — output cleanup.
  async function cleaned(raw, original) {
    reset();
    script(reply(raw));
    const out = await run('grammar', original);
    return out.value?.text ?? `ERROR ${out.error?.code}`;
  }
  check('markdown fence around the whole reply is stripped',
    (await cleaned('```text\nfixed text\n```', 'fixd text')) === 'fixed text');
  check('fence is kept when the original contained one',
    (await cleaned('```\ncode\n```', 'some ```code``` here')) === '```\ncode\n```');
  check('matching double quotes are stripped when the original had none',
    (await cleaned('"fixed text"', 'fixd text')) === 'fixed text');
  check('curly quotes are stripped too',
    (await cleaned('“fixed text”', 'fixd text')) === 'fixed text');
  check('quotes are kept when the original started with one',
    (await cleaned('"fixed text"', '"fixd text"')) === '"fixed text"');
  check('echoed sentinels are stripped',
    (await cleaned('<<<TEXT\nfixed text\nTEXT>>>', 'fixd text')) === 'fixed text');
  check('CRLF is normalised and the result trimmed',
    (await cleaned('  line one\r\nline two \n', 'l1 l2')) === 'line one\nline two');

  // 10 — thinking-variant discovery: cheapest first, remembered, remembered goes first.
  reset();
  script(http(400, { error: { message: 'Unknown name "thinkingLevel"' } }), reply('ok'));
  r = await run('grammar', 'text');
  check('first attempt asks for thinkingLevel: minimal',
    window.__fetches[0]?.body?.generationConfig?.thinkingConfig?.thinkingLevel === 'minimal',
    JSON.stringify(window.__fetches[0]?.body?.generationConfig));
  check('an INVALID_ARGUMENT retries with the next variant and succeeds',
    r.value?.text === 'ok' && window.__fetches[1]?.body?.generationConfig?.thinkingConfig?.thinkingLevel === 'MINIMAL',
    JSON.stringify(window.__fetches[1]?.body?.generationConfig));
  check('the variant that worked is remembered for this model in storage',
    window.__storage.thinkingVariants?.[SETTINGS.model] === 'LEVEL-MINIMAL', JSON.stringify(window.__storage));

  reset();
  window.__storage = { thinkingVariants: { [SETTINGS.model]: 'budget-0' } };
  script(reply('ok'));
  r = await run('grammar', 'text');
  check('the remembered variant is tried first',
    window.__fetches.length === 1 && window.__fetches[0]?.body?.generationConfig?.thinkingConfig?.thinkingBudget === 0,
    JSON.stringify(window.__fetches[0]?.body?.generationConfig));

  reset();
  window.__storage = { thinkingVariants: { [SETTINGS.model]: 'none' } };
  script(reply('ok'));
  r = await run('grammar', 'text');
  check('remembered "none" sends no thinkingConfig at all',
    window.__fetches.length === 1 && !('thinkingConfig' in window.__fetches[0].body.generationConfig),
    JSON.stringify(window.__fetches[0]?.body?.generationConfig));

  reset();
  window.__storage = { thinkingVariants: { [SETTINGS.model]: 'budget-0' } };
  script(http(400, { error: { message: 'nope' } }), reply('ok'));
  r = await run('grammar', 'text');
  check('a rejected remembered variant falls back to the cheapest-first order',
    window.__fetches[1]?.body?.generationConfig?.thinkingConfig?.thinkingLevel === 'minimal' &&
    window.__storage.thinkingVariants[SETTINGS.model] === 'level-minimal',
    JSON.stringify(window.__fetches[1]?.body?.generationConfig) + ' ' + JSON.stringify(window.__storage));

  // 11 — settings schema: the provider seam's new fields have defaults.
  reset();
  const s = await getSettings();
  check('getSettings() returns provider: "gemini" when unset', s.provider === 'gemini', `provider = ${JSON.stringify(s.provider)}`);
  check('getSettings() returns onDeviceTranslate: false when unset', s.onDeviceTranslate === false,
    `onDeviceTranslate = ${JSON.stringify(s.onDeviceTranslate)}`);
  reset();
  window.__storage = { provider: 'gemini', onDeviceTranslate: true };
  check('getSettings() returns a stored onDeviceTranslate', (await getSettings()).onDeviceTranslate === true);

  // 12 — the live model list: only content-generating models, Flash first,
  // newest generation floating up, the recommended one marked.
  const LIVE = [
    gm('embedding-001', 'Embedding 001', ['embedContent']),
    gm('gemini-3.1-pro-preview', 'Gemini 3.1 Pro Preview'),
    gm('gemini-3.6-flash', 'Gemini 3.6 Flash'),
    gm('imagen-4', 'Imagen 4', ['predict']),
    gm('gemini-3.8-flash', 'Gemini 3.8 Flash'),
    gm('gemini-3.5-flash-lite', 'Gemini 3.5 Flash-Lite'),
    gm('gemini-3.2-pro', 'Gemini 3.2 Pro'),
    gm('aqa', 'Model that performs Attributed Question Answering', ['generateAnswer'])
  ];
  reset();
  script(modelsPage(LIVE));
  r = await list();
  check('listModels keeps only models that support generateContent, Flash first, newest first within each group',
    JSON.stringify(ids(r.value?.models)) === JSON.stringify([
      'gemini-3.8-flash', 'gemini-3.6-flash', 'gemini-3.5-flash-lite', 'gemini-3.2-pro', 'gemini-3.1-pro-preview'
    ]),
    `got ${JSON.stringify(ids(r.value?.models))} ${r.error ? r.error.code + ': ' + r.error.message : ''}`);
  check('listModels resolves to { models, fetchedAt, source: "live" } with labels from displayName',
    r.value?.source === 'live' && typeof r.value.fetchedAt === 'number' && r.value.models[0]?.label === 'Gemini 3.8 Flash',
    JSON.stringify(r.value));
  check('the first Flash model is marked recommended when the hardcoded default is not offered',
    r.value?.models.filter((m) => m.recommended).map((m) => m.id).join() === 'gemini-3.8-flash',
    JSON.stringify(r.value?.models));
  check('the models list is fetched with the key in the header, not the URL',
    window.__fetches[0]?.url === 'https://generativelanguage.googleapis.com/v1beta/models' &&
    window.__fetches[0]?.headers['x-goog-api-key'] === 'test-key',
    JSON.stringify(window.__fetches[0]));

  // 13 — the list is cached for 24 h under the key's fingerprint; the key
  // itself never goes into the cache.
  const cache = () => window.__storage.modelCache;
  check('a live fetch is cached in storage as modelCache { models, fetchedAt, keyFingerprint }',
    Array.isArray(cache()?.models) && cache().models.length === 5 && typeof cache().fetchedAt === 'number' &&
    typeof cache().keyFingerprint === 'string' && cache().keyFingerprint.length > 0,
    JSON.stringify(cache()));
  check('the cache never contains the API key', !JSON.stringify(cache() ?? {}).includes('test-key'), JSON.stringify(cache()));

  const HOUR = 60 * 60 * 1000;
  const freshCache = () => JSON.parse(JSON.stringify(cache()));
  const cachedFrom = freshCache();
  window.__fetches = [];
  r = await list();
  check('a second call within 24 h with the same key returns the cache without fetching',
    window.__fetches.length === 0 && r.value?.source === 'live' && r.value.fetchedAt === cachedFrom.fetchedAt &&
    JSON.stringify(ids(r.value.models)) === JSON.stringify(ids(cachedFrom.models)),
    `fetches = ${window.__fetches.length}, got ${JSON.stringify(r.value ?? r.error?.message)}`);

  reset();
  window.__storage = { modelCache: { ...cachedFrom, fetchedAt: Date.now() - 25 * HOUR } };
  script(modelsPage([gm('gemini-4.0-flash', 'Gemini 4.0 Flash')]));
  r = await list();
  check('a call after 24 h fetches again and replaces the cache',
    window.__fetches.length === 1 && ids(r.value?.models).join() === 'gemini-4.0-flash' && ids(cache()?.models).join() === 'gemini-4.0-flash',
    `fetches = ${window.__fetches.length}, got ${JSON.stringify(r.value ?? r.error?.message)}`);

  reset();
  window.__storage = { modelCache: cachedFrom };
  script(modelsPage([gm('gemini-4.0-flash', 'Gemini 4.0 Flash')]));
  r = await list({ ...SETTINGS, apiKey: 'another-key' });
  check('a fresh cache made with a different key is ignored: it fetches and re-fingerprints',
    window.__fetches.length === 1 && ids(r.value?.models).join() === 'gemini-4.0-flash' &&
    cache()?.keyFingerprint !== cachedFrom.keyFingerprint && !JSON.stringify(cache()).includes('another-key'),
    `fetches = ${window.__fetches.length}, cache = ${JSON.stringify(cache())}`);

  reset();
  window.__storage = { modelCache: cachedFrom };
  script(modelsPage([gm('gemini-4.0-flash', 'Gemini 4.0 Flash')]));
  r = await list(SETTINGS, { force: true });
  check('force: true bypasses a fresh cache', window.__fetches.length === 1 && ids(r.value?.models).join() === 'gemini-4.0-flash',
    `fetches = ${window.__fetches.length}, got ${JSON.stringify(r.value ?? r.error?.message)}`);

  reset();
  script(modelsPage([gm('gemini-3.8-flash', 'Gemini 3.8 Flash'), gm('gemini-3.10-flash', 'Gemini 3.10 Flash'), gm('gemini-3.7-flash', 'Gemini 3.7 Flash')]));
  r = await list();
  check('the hardcoded default is the recommended one when the key offers it, even when a newer Flash exists',
    r.value?.models.filter((m) => m.recommended).map((m) => m.id).join() === 'gemini-3.7-flash', JSON.stringify(r.value?.models));
  check('ordering is numeric-aware: 3.10 floats above 3.8',
    ids(r.value?.models).join() === 'gemini-3.10-flash,gemini-3.8-flash,gemini-3.7-flash', JSON.stringify(ids(r.value?.models)));

  // 14 — any failure falls back to the hardcoded list and leaves a good cache alone.
  const staleCache = { ...cachedFrom, fetchedAt: Date.now() - 25 * HOUR };
  async function expectFallback(name, responses, { settings = SETTINGS, fetches } = {}) {
    reset();
    window.__storage = { modelCache: JSON.parse(JSON.stringify(staleCache)) };
    script(...responses);
    const out = await list(settings);
    const v = out.value;
    const pass = v && v.source === 'fallback' && v.fetchedAt === null &&
      JSON.stringify(ids(v.models)) === JSON.stringify(ids(MODELS)) &&
      JSON.stringify(cache()) === JSON.stringify(staleCache) &&
      (fetches === undefined || window.__fetches.length === fetches);
    check(name, pass, `got ${JSON.stringify(v ?? out.error?.message)}; fetches = ${window.__fetches.length}; cache = ${JSON.stringify(cache())}`);
  }
  await expectFallback('network failure → hardcoded list as source "fallback", stale cache untouched', [after(0, networkFailure())], { fetches: 1 });
  await expectFallback('HTTP 403 → fallback', [http(403, { error: { message: 'PERMISSION_DENIED' } })]);
  await expectFallback('HTTP 500 → fallback', [http(500)]);
  await expectFallback('an empty models list → fallback', [modelsPage([])]);
  await expectFallback('a list with nothing that generates content → fallback', [modelsPage([gm('embedding-001', 'Embedding', ['embedContent'])])]);
  reset();
  window.__storage = { modelCache: JSON.parse(JSON.stringify(staleCache)) };
  script(never());
  let listOutcome = null;
  const hangingList = listModels(SETTINGS).then((value) => { listOutcome = value; });
  await H.advance(19999);
  const listPending = listOutcome === null;
  await H.advance(1);
  const listSettledAt20 = listOutcome !== null;
  if (!listSettledAt20) await H.advance(600000);
  await hangingList;
  check('a hanging list fetch → fallback at exactly 20 s, stale cache untouched',
    listPending && listSettledAt20 && listOutcome?.source === 'fallback' && JSON.stringify(cache()) === JSON.stringify(staleCache),
    `pending at 19.999 s = ${listPending}, settled at 20 s = ${listSettledAt20}, got ${JSON.stringify(listOutcome)}`);
  check('a failed list fetch leaves no timer behind', H.pendingTimers() === 0, `pending = ${H.pendingTimers()}`);
  await expectFallback('no API key → fallback without fetching', [modelsPage(LIVE)], { settings: { ...SETTINGS, apiKey: '' }, fetches: 0 });
  check('the hardcoded fallback marks the default model recommended',
    MODELS.filter((m) => m.recommended).map((m) => m.id).join() === 'gemini-3.7-flash', JSON.stringify(MODELS));

  // 15 — pagination is followed until there is no nextPageToken.
  reset();
  script(modelsPage([gm('gemini-3.2-pro', 'Gemini 3.2 Pro')], 'page-2'), modelsPage([gm('gemini-3.8-flash', 'Gemini 3.8 Flash')]));
  r = await list();
  check('a nextPageToken is followed and the pages are merged before ordering',
    window.__fetches.length === 2 && window.__fetches[1]?.url.includes('pageToken=page-2') &&
    ids(r.value?.models).join() === 'gemini-3.8-flash,gemini-3.2-pro',
    `fetches = ${JSON.stringify(window.__fetches.map((f) => f.url))}, got ${JSON.stringify(ids(r.value?.models))}`);

  // 16 — the stale-model check in getSettings prefers the cached live list:
  // a model Google offers but the built-in list has never heard of is kept,
  // and one that is in neither falls back to the default.
  const liveCache = { models: [{ id: 'gemini-4.0-flash', label: 'Gemini 4.0 Flash', recommended: true }], fetchedAt: Date.now(), keyFingerprint: 'x' };
  reset();
  window.__storage = { model: 'gemini-4.0-flash', modelCache: liveCache };
  check('getSettings keeps a saved model that is in the cached live list but not the hardcoded one',
    (await getSettings()).model === 'gemini-4.0-flash', `model = ${(await getSettings()).model}`);
  reset();
  window.__storage = { model: 'gemini-3.6-flash', modelCache: liveCache };
  check('getSettings keeps a saved model that is in the hardcoded list when the live cache lacks it',
    (await getSettings()).model === 'gemini-3.6-flash', `model = ${(await getSettings()).model}`);
  reset();
  window.__storage = { model: 'gemini-retired', modelCache: liveCache };
  check('getSettings falls back to the default when the saved model is in neither list',
    (await getSettings()).model === 'gemini-3.7-flash', `model = ${(await getSettings()).model}`);

  // 17 — a retired model heals itself: BAD_MODEL refreshes the list once
  // (bypassing the cache), saves the recommended model, retries once.
  const notFound = () => http(404, { error: { message: 'models/gemini-test-model is not found' } });
  const urlOf = (i) => window.__fetches[i]?.url || '';
  reset();
  window.__storage = { modelCache: { ...cachedFrom, fetchedAt: Date.now() } }; // fresh cache: must be bypassed
  script(notFound(), modelsPage(LIVE), reply('healed'));
  r = await run('grammar', 'some text');
  check('BAD_MODEL → one list fetch, one retry with the recommended model, success returned',
    r.value?.text === 'healed' && window.__fetches.length === 3 &&
    urlOf(0).includes('/gemini-test-model:generateContent') &&
    urlOf(1) === 'https://generativelanguage.googleapis.com/v1beta/models' &&
    urlOf(2).includes('/gemini-3.8-flash:generateContent'),
    `got ${JSON.stringify(r.value ?? r.error?.code)}, fetches = ${JSON.stringify(window.__fetches.map((f) => f.url))}`);
  check('the recommended model is saved as the model setting and the cache is replaced',
    window.__storage.model === 'gemini-3.8-flash' && ids(cache()?.models)[0] === 'gemini-3.8-flash',
    JSON.stringify({ model: window.__storage.model, cache: ids(cache()?.models) }));
  check('every request in the BAD_MODEL path carries the same deadline signal',
    window.__fetches.every((f) => f.signal && f.signal === window.__fetches[0].signal),
    `distinct signals = ${new Set(window.__fetches.map((f) => f.signal)).size}`);
  check('a healed action leaves no timer behind', H.pendingTimers() === 0, `pending = ${H.pendingTimers()}`);

  await expectError('BAD_MODEL whose list refresh fails → the original BAD_MODEL, no retry',
    [notFound(), http(500)], 'BAD_MODEL', { fetches: 2 });
  check('a failed refresh leaves the model setting alone', window.__storage.model === undefined, JSON.stringify(window.__storage));
  await expectError('BAD_MODEL whose retry fails → the retry\'s error, no third attempt',
    [notFound(), modelsPage(LIVE), http(429, { error: { message: 'quota' } })], 'RATE_LIMIT', { fetches: 3 });
  await expectError('BAD_MODEL twice → BAD_MODEL after exactly one retry',
    [notFound(), modelsPage(LIVE), notFound()], 'BAD_MODEL', { fetches: 3 });
  await expectError('BAD_MODEL when the fresh list still recommends the same model → BAD_MODEL without a retry',
    [notFound(), modelsPage([gm('gemini-test-model', 'Test')])], 'BAD_MODEL', { fetches: 2 });

  // The heal shares the action's 20 s budget: 15 s to get the 404, then a
  // hanging list fetch → TIMEOUT at 20 s from the start, not 35 s.
  reset();
  script(after(15000, notFound()), never());
  outcome = null;
  const healing = runAction('grammar', 'hello there', SETTINGS).then(
    (value) => { outcome = { value }; },
    (error) => { outcome = { error }; }
  );
  await H.advance(19999);
  const stillHealing = outcome === null;
  await H.advance(1);
  const healSettledAt20 = outcome !== null;
  if (!healSettledAt20) await H.advance(600000);
  await healing;
  check('a hanging list fetch during the heal → TIMEOUT at 20 s of the action, not a fresh budget',
    stillHealing && healSettledAt20 && outcome?.error?.code === 'TIMEOUT' && window.__fetches.length === 2 &&
    window.__fetches[0].signal === window.__fetches[1].signal,
    `pending at 19.999 s = ${stillHealing}, settled at 20 s = ${healSettledAt20}, code = ${outcome?.error?.code}, fetches = ${window.__fetches.length}`);
  check('the timed-out heal leaves no timer behind', H.pendingTimers() === 0, `pending = ${H.pendingTimers()}`);

  // 18 — validate key: the cheapest authenticated call (a GET on the models
  // endpoint), ok or the same mapped errors as everything else.
  /** Run validateKey to completion, driving fake time, and return { value } or { error }. */
  const validate = (key) => H.run((k) => validateKey(k), key);
  reset();
  script(modelsPage([gm('gemini-3.7-flash', 'Gemini 3.7 Flash')]));
  r = await validate('test-key');
  check('validateKey resolves to { ok: true } on a 200 from the models endpoint',
    r.value?.ok === true, `got ${JSON.stringify(r.value ?? r.error?.message)}`);
  check('validateKey GETs the models endpoint once with the key in the header, not the URL',
    window.__fetches.length === 1 && window.__fetches[0].url === 'https://generativelanguage.googleapis.com/v1beta/models' &&
    window.__fetches[0].headers['x-goog-api-key'] === 'test-key',
    JSON.stringify(window.__fetches));
  check('a successful validate clears its deadline timer', H.pendingTimers() === 0, `pending = ${H.pendingTimers()}`);

  /** Script the responses, validate `key`, and expect an AiError with `code`. */
  async function expectValidateError(name, responses, code, { key = 'test-key', fetches } = {}) {
    reset();
    script(...responses);
    const out = await validate(key);
    const err = out.error;
    const pass = err instanceof AiError && err.code === code &&
      (fetches === undefined || window.__fetches.length === fetches);
    check(name, pass,
      `got ${err ? `${err.code}: ${err.message}` : JSON.stringify(out.value)}; fetches = ${window.__fetches.length}`);
    return err;
  }
  await expectValidateError('validateKey: 400 mentioning the API key → BAD_KEY',
    [http(400, { error: { message: 'API key not valid. Please pass a valid API key.' } })], 'BAD_KEY', { fetches: 1 });
  await expectValidateError('validateKey: 401 → BAD_KEY', [http(401, {})], 'BAD_KEY', { fetches: 1 });
  const plain403 = await expectValidateError('validateKey: 403 → BAD_KEY',
    [http(403, { error: { message: 'PERMISSION_DENIED' } })], 'BAD_KEY', { fetches: 1 });
  check('validateKey: a plain 403 does not claim the API is disabled', !/not enabled|disabled/i.test(plain403?.message || ''), plain403?.message);
  const disabled = await expectValidateError('validateKey: 403 whose detail says the API is disabled → BAD_KEY',
    [http(403, { error: { message: 'Generative Language API has not been used in project 123 before or it is disabled. Enable it by visiting https://console.developers.google.com/apis/api/generativelanguage.googleapis.com/overview then retry.' } })],
    'BAD_KEY', { fetches: 1 });
  check('validateKey: the API-disabled 403 says the API is not enabled for the project, distinct from a plain 403',
    /Generative Language API/.test(disabled?.message || '') && /not enabled/i.test(disabled?.message || '') &&
    disabled?.message !== plain403?.message, disabled?.message);
  await expectValidateError('validateKey: 429 → RATE_LIMIT', [http(429, { error: { message: 'quota' } })], 'RATE_LIMIT', { fetches: 1 });
  await expectValidateError('validateKey: 500 → SERVER', [http(500)], 'SERVER', { fetches: 1 });
  await expectValidateError('validateKey: fetch throws → NETWORK', [after(0, networkFailure())], 'NETWORK', { fetches: 1 });
  check('a failed validate clears its deadline timer', H.pendingTimers() === 0, `pending = ${H.pendingTimers()}`);
  await expectValidateError('validateKey: empty key → NO_API_KEY without a fetch', [modelsPage(LIVE)], 'NO_API_KEY', { key: '', fetches: 0 });
  await expectValidateError('validateKey: whitespace-only key → NO_API_KEY without a fetch', [modelsPage(LIVE)], 'NO_API_KEY', { key: '  \n', fetches: 0 });
  reset();
  script(modelsPage(LIVE));
  r = await validate('  padded-key ');
  check('validateKey trims the key before sending it',
    r.value?.ok === true && window.__fetches[0]?.headers['x-goog-api-key'] === 'padded-key', JSON.stringify(window.__fetches[0]?.headers));

  reset();
  script(never());
  outcome = null;
  const hangingValidate = validateKey('test-key').then(
    (value) => { outcome = { value }; },
    (error) => { outcome = { error }; }
  );
  await H.advance(19999);
  const validatePending = outcome === null;
  await H.advance(1);
  const validateSettledAt20 = outcome !== null;
  if (!validateSettledAt20) await H.advance(600000);
  await hangingValidate;
  check('validateKey: a hanging fetch → TIMEOUT at exactly 20 s',
    validatePending && validateSettledAt20 && outcome?.error?.code === 'TIMEOUT',
    `pending at 19.999 s = ${validatePending}, settled at 20 s = ${validateSettledAt20}, code = ${outcome?.error?.code}`);
  check('a timed-out validate leaves no timer behind', H.pendingTimers() === 0, `pending = ${H.pendingTimers()}`);

  // 19 — listModels can be told which key to use, so the options page can list
  // models for a key that was just pasted and is not saved yet.
  reset();
  window.__storage = { modelCache: cachedFrom }; // fresh, fingerprinted for 'test-key'
  script(modelsPage([gm('gemini-4.0-flash', 'Gemini 4.0 Flash')]));
  r = await list(SETTINGS, { apiKey: 'pasted-key' });
  check('listModels with an apiKey override sends that key, ignores the other key\'s cache, and fingerprints the override',
    window.__fetches.length === 1 && window.__fetches[0].headers['x-goog-api-key'] === 'pasted-key' &&
    ids(r.value?.models).join() === 'gemini-4.0-flash' &&
    cache()?.keyFingerprint !== cachedFrom.keyFingerprint && !JSON.stringify(cache()).includes('pasted-key'),
    `fetches = ${JSON.stringify(window.__fetches.map((f) => f.headers))}, got ${JSON.stringify(r.value ?? r.error?.message)}, cache = ${JSON.stringify(cache())}`);
  reset();
  window.__storage = { modelCache: cachedFrom };
  script(modelsPage(LIVE));
  r = await list({ ...SETTINGS, apiKey: '' }, { apiKey: 'test-key' });
  check('an apiKey override with no saved key still hits the cache for that override',
    window.__fetches.length === 0 && r.value?.source === 'live' && ids(r.value.models).join() === ids(cachedFrom.models).join(),
    `fetches = ${window.__fetches.length}, got ${JSON.stringify(r.value ?? r.error?.message)}`);
  reset();
  script(modelsPage(LIVE));
  r = await list({ ...SETTINGS, apiKey: '' }, { apiKey: '  ' });
  check('a blank apiKey override with no saved key → fallback without fetching',
    window.__fetches.length === 0 && r.value?.source === 'fallback',
    `fetches = ${window.__fetches.length}, got ${JSON.stringify(r.value ?? r.error?.message)}`);

  // 20 — the never-stuck helper (lib/never-stuck.js) the options page wraps the
  // Test button in: Cancel offered at 5 s, hard stop at 20 s, a late reply
  // after either is dropped. Same rules as the content script, as a module.
  /** A task that settles at fake time `ms` (never, for Infinity); resolves with `value` or rejects with an Error. */
  const settlingAt = (ms, value) => () => new Promise((resolve, reject) => {
    if (ms === Infinity) return;
    setTimeout(() => (value instanceof Error ? reject(value) : resolve(value)), ms);
  });
  /** Drive runNeverStuck with fake time; returns { outcome, stillWorkingAt, cancel, signal }. */
  async function drive(task, { until = 25000, cancelAt = null } = {}) {
    const rec = { outcome: null, stillWorkingAt: null, cancel: null, signal: null };
    const p = runNeverStuck((signal) => { rec.signal = signal; return task(signal); }, {
      onStillWorking: (cancel) => { rec.stillWorkingAt = fakeNowRead(); rec.cancel = cancel; }
    }).then((o) => { rec.outcome = o; });
    for (let t = 0; t < until && !rec.outcome; t += 1000) {
      await H.advance(1000);
      if (cancelAt !== null && t + 1000 >= cancelAt && rec.cancel && !rec.cancelled) {
        rec.cancelled = true;
        rec.cancel();
        await H.advance(0); // let the outcome land before deciding whether to keep advancing
      }
    }
    if (rec.outcome) await p;
    return rec;
  }
  const fakeNowRead = () => H.now();

  reset();
  let ns = await drive(settlingAt(1000, 'fast'));
  check('never-stuck: a task done at 1 s → { status: "done", value } with no Still-working call',
    ns.outcome?.status === 'done' && ns.outcome.value === 'fast' && ns.stillWorkingAt === null,
    JSON.stringify({ outcome: ns.outcome, stillWorkingAt: ns.stillWorkingAt }));
  check('never-stuck: a finished run leaves no timer behind', H.pendingTimers() === 0, `pending = ${H.pendingTimers()}`);

  reset();
  ns = await drive(settlingAt(7000, 'slow'));
  check('never-stuck: Still working is offered at 5 s and the task still completes at 7 s',
    ns.stillWorkingAt === 5000 && ns.outcome?.status === 'done' && ns.outcome.value === 'slow',
    JSON.stringify({ outcome: ns.outcome, stillWorkingAt: ns.stillWorkingAt }));

  reset();
  ns = await drive(settlingAt(Infinity), { cancelAt: 6000 });
  check('never-stuck: Cancel at 6 s → { status: "cancelled" } at once, the signal aborted, no timers left',
    ns.outcome?.status === 'cancelled' && ns.signal?.aborted === true && H.pendingTimers() === 0 && H.now() === 6000,
    JSON.stringify({ outcome: ns.outcome, aborted: ns.signal?.aborted, pending: H.pendingTimers(), now: H.now() }));

  reset();
  const lateTask = settlingAt(9000, 'late');
  ns = await drive(lateTask, { cancelAt: 6000 });
  await H.advance(10000); // the task settles at 9 s, after the cancel
  check('never-stuck: a reply that lands after Cancel is dropped (outcome stays cancelled)',
    ns.outcome?.status === 'cancelled', JSON.stringify(ns.outcome));

  reset();
  ns = await drive(settlingAt(Infinity));
  check('never-stuck: a task that never settles → { status: "timed-out" } at exactly 20 s, signal aborted',
    ns.outcome?.status === 'timed-out' && ns.signal?.aborted === true && H.now() === 20000 && ns.stillWorkingAt === 5000,
    JSON.stringify({ outcome: ns.outcome, aborted: ns.signal?.aborted, now: H.now() }));
  check('never-stuck: a timed-out run leaves no timer behind', H.pendingTimers() === 0, `pending = ${H.pendingTimers()}`);

  reset();
  ns = await drive(settlingAt(2000, new Error('boom')));
  check('never-stuck: a task that rejects → { status: "failed", error }',
    ns.outcome?.status === 'failed' && ns.outcome.error?.message === 'boom' && H.pendingTimers() === 0,
    JSON.stringify({ outcome: ns.outcome, pending: H.pendingTimers() }));

  const failed = results.filter((x) => x.startsWith('FAIL')).length;
  document.getElementById('out').textContent =
    results.join('\n') + `\n\n${results.length - failed}/${results.length} passed` +
    (failed ? `  — ${failed} FAILED` : '  — all good');
  document.title = failed ? `FAILED ${failed}` : 'ALL PASS';
}

main().catch((err) => {
  document.getElementById('out').textContent =
    'harness crashed: ' + err.message + '\n' + err.stack + '\n\n' + results.join('\n');
  document.title = 'HARNESS CRASH';
});
</script>
</body>
</html>
