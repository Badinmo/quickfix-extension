<!--
  Drives lib/ai.js (the provider seam) against a stubbed fetch and a stubbed
  chrome.storage.local, so runAction's result object, its error codes, what it
  sends to Gemini and what it remembers in storage — and listModels' live list,
  its 24 h cache and the BAD_MODEL self-heal — can all be checked without a
  key, a network, or an extension context. This is the test to run after
  touching lib/ai.js or lib/config.js.

  Time is faked: setTimeout/clearTimeout are replaced with a scheduler the
  harness advances by hand, so the 20 s hard stop is tested in milliseconds.

    & "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --headless=new `
      --disable-gpu --no-first-run --user-data-dir="$env:TEMP\qf-edge" `
      --allow-file-access-from-files --virtual-time-budget=10000 --dump-dom `
      "file:///C:/Users/motha/Projects/Extensions/New%20folder/quickfix-extension/quickfix-extension/test/provider-test.html"

<script>
/* ------------------------------------------------------------ fake time */
// Installed before the module loads. ai.js calls the global setTimeout, so
// its deadline lands in this scheduler and the harness decides when it fires.

const realSetTimeout = window.setTimeout.bind(window);
let fakeNow = 0;
let fakeTimers = [];
let fakeSeq = 0;

window.setTimeout = (fn, ms = 0, ...args) => {
  fakeTimers.push({ id: ++fakeSeq, at: fakeNow + Math.max(0, ms), fn, args });
  return fakeSeq;
};
window.clearTimeout = (id) => {
  fakeTimers = fakeTimers.filter((t) => t.id !== id);
};

/** Let every pending promise reaction run. */
const flush = () => new Promise((r) => realSetTimeout(r, 0));

/** Advance fake time by `ms`, firing due timers in order and flushing between them. */
async function advance(ms) {
  const target = fakeNow + ms;
  await flush(); // let work already queued (e.g. a storage read before the fetch) register its timers first
  for (;;) {
    fakeTimers.sort((a, b) => a.at - b.at || a.id - b.id);
    const next = fakeTimers[0];
    if (!next || next.at > target) break;
    fakeTimers.shift();
    fakeNow = next.at;
    next.fn(...next.args);
    await flush();
  }
  fakeNow = target;
  await flush();
}

/* ---------------------------------------------------------- chrome stub */

window.__storage = {};
window.chrome = {
  storage: {
    local: {
      get: (keys) => {
        const out = {};
        if (typeof keys === 'string') keys = [keys];
        if (Array.isArray(keys)) {
          for (const k of keys) if (k in window.__storage) out[k] = window.__storage[k];
        } else if (keys && typeof keys === 'object') {
          for (const k of Object.keys(keys)) out[k] = k in window.__storage ? window.__storage[k] : keys[k];
        } else {
          Object.assign(out, window.__storage);
        }
        return Promise.resolve(JSON.parse(JSON.stringify(out)));
      },
      set: (patch) => {
        Object.assign(window.__storage, JSON.parse(JSON.stringify(patch)));
        return Promise.resolve();
      }
    }
  }
};

/* ----------------------------------------------------------- fetch stub */
// Each call to fetch takes the next scripted response off the queue. A script
// entry is a function (url, init) => Promise<Response>. What was sent is
// recorded in __fetches as { url, headers, body (parsed), signal }.

window.__fetches = [];
let fetchScript = [];

const abortError = () => new DOMException('The user aborted a request.', 'AbortError');

window.fetch = (url, init = {}) => {
  let body = null;
  try { body = JSON.parse(init.body); } catch { /* not JSON */ }
  window.__fetches.push({ url: String(url), headers: init.headers || {}, body, signal: init.signal });
  const next = fetchScript.shift();
  if (!next) return Promise.reject(new Error('harness: no scripted response left for fetch'));
  return next(url, init);
};

/** Wait `ms` of fake time, then settle with `result`; rejects with AbortError if the signal fires first. */
function after(ms, result) {
  return (_url, init) =>
    new Promise((resolve, reject) => {
      const signal = init.signal;
      if (signal?.aborted) return reject(abortError());
      const timer = setTimeout(() => {
        if (signal?.aborted) return;
        result instanceof Error ? reject(result) : resolve(result);
      }, ms);
      signal?.addEventListener('abort', () => { clearTimeout(timer); reject(abortError()); });
    });
}

/** A fetch that never settles on its own — only an abort ends it. */
const never = () => after(Infinity, null);

/**
 * The parts of a Response the provider reads. A plain object rather than a real
 * Response so json() settles in a microtask and fake time stays deterministic.
 * No payload means a non-JSON body: json() rejects, as the real one would.
 */
const http = (status, payload) => ({
  ok: status >= 200 && status < 300,
  status,
  json: () => (payload === undefined ? Promise.reject(new SyntaxError('not JSON')) : Promise.resolve(payload))
});

const reply = (text, extra = {}) =>
  http(200, { candidates: [{ content: { parts: [{ text }] }, finishReason: 'STOP', ...extra }] });

const networkFailure = () => new TypeError('Failed to fetch');

function script(...responses) {
  fetchScript = responses.map((r) => (typeof r === 'function' ? r : after(0, r)));
}

/* ------------------------------------------------------------- test rig */

const results = [];
function check(name, pass, detail) {
  results.push(`${pass ? 'PASS' : 'FAIL'}  ${name}${pass || !detail ? '' : '\n        ' + detail}`);
  // Written as we go, so a case that hangs still leaves the earlier results visible.
  document.getElementById('out').textContent = results.join('\n') + '\n\nrunning…';
}

function reset() {
  window.__storage = {};
  window.__fetches = [];
  delete window.Translator;
  delete window.LanguageDetector;
  fetchScript = [];
  fakeTimers = [];
  fakeNow = 0;
}

/** Run runAction to completion, driving fake time, and return { value } or { error }. */
async function run(runAction, action, text, settings) {
  let outcome = null;
  const p = runAction(action, text, settings).then(
    (value) => { outcome = { value }; },
    (error) => { outcome = { error }; }
  );
  // Scripted responses settle at fake time 0 unless a case says otherwise;
  // advancing past the deadline guarantees termination either way.
  for (let i = 0; i < 20 && !outcome; i++) await advance(5000);
  await p;
  return outcome;
}

const SETTINGS = {
  apiKey: 'test-key',
  model: 'gemini-test-model',
  targetLanguage: 'Arabic',
  secondaryLanguage: 'English',
  autoSwapLanguage: true,
  onDeviceTranslate: false,
  tone: 'preserve',
  customInstructions: ''
};

/* ------------------------------------------------------- on-device stub */
// The built-in Translator / LanguageDetector as the provider sees them: real
// ambient globals, stood in the same way the harness stands in window.fetch
// and window.chrome — assigned directly, no injection seam of their own.
// reset() deletes both (absent); a case installs a fake pair with onDevice().
// Every create / translate / detect call is recorded so a case can assert
// which pair was asked for.

/**
 * @param {object} [o]
 * @param {'absent'|string|((opts) => string)} [o.translator]  'absent' for no Translator global,
 *   else what availability() answers (a function sees the { sourceLanguage, targetLanguage } asked for)
 * @param {'absent'|string} [o.detector]  same for LanguageDetector
 * @param {string} [o.detected]  the language the detector reports
 * @param {(text, opts) => string|Promise<string>} [o.translate]  what translate() does; default echoes the pair
 * @param {(opts, rec) => Promise<object>} [o.create]  full override for Translator.create — used by the
 *   download-consent cases (#10) to fire monitor(m)'s downloadprogress and/or honour opts.signal; opts
 *   carries sourceLanguage/targetLanguage/signal/monitor exactly as downloadOnDeviceLanguage passes them
 */
function onDevice({ translator = 'available', detector = 'available', detected = 'en', translate, create } = {}) {
  const rec = { creates: [], translates: [], detects: [], destroyed: 0 };
  if (translator !== 'absent') {
    window.Translator = {
      availability: async (opts) => (typeof translator === 'function' ? translator(opts) : translator),
      create: create
        ? (opts) => create(opts, rec)
        : async (opts) => {
            rec.creates.push({ sourceLanguage: opts.sourceLanguage, targetLanguage: opts.targetLanguage });
            return {
              translate: async (text, o) => {
                rec.translates.push({ text, signal: o?.signal });
                return translate ? translate(text, opts) : `[${opts.sourceLanguage}→${opts.targetLanguage}] ${text}`;
              },
              destroy: () => { rec.destroyed++; }
            };
          }
    };
  } else {
    delete window.Translator;
  }
  if (detector !== 'absent') {
    window.LanguageDetector = {
      availability: async () => detector,
      create: async () => ({
        detect: async (text) => { rec.detects.push(text); return [{ detectedLanguage: detected, confidence: 0.9 }]; },
        destroy: () => {}
      })
    };
  } else {
    delete window.LanguageDetector;
  }
  return rec;
}

const pendingTimers = () => fakeTimers.length;
const now = () => fakeNow;

window.__harness = { advance, now, pendingTimers, check, reset, run, script, after, never, abortError, http, reply, networkFailure, onDevice, SETTINGS, results };
</script>

<script type="module">
import { runAction, listModels, validateKey, AiError } from '../lib/ai.js';
import { onDeviceStatus, downloadOnDeviceLanguage, pairKey, hasConsent, addConsent } from '../lib/on-device.js';
import { getSettings, MAX_CHARS, MODELS, LANGUAGES, LANGUAGE_CODES } from '../lib/config.js';
import { runNeverStuck } from '../lib/never-stuck.js';

const H = window.__harness;
const { check, reset, script, reply, http, after, never, abortError, networkFailure, onDevice, SETTINGS, results } = H;
const run = (action, text, settings = SETTINGS) => H.run(runAction, action, text, settings);
/** Run listModels to completion, driving fake time, and return { value } or { error }. */
const list = (settings = SETTINGS, opts) => H.run((s, o) => listModels(s, o), settings, opts);
const lastBody = () => window.__fetches[window.__fetches.length - 1]?.body;

/** A Gemini models-list entry as the API shapes it. */
const gm = (name, displayName, methods = ['generateContent'], extra = {}) =>
  ({ name: `models/${name}`, displayName, supportedGenerationMethods: methods, ...extra });
const modelsPage = (models, nextPageToken) => http(200, nextPageToken ? { models, nextPageToken } : { models });
const ids = (models) => (models || []).map((m) => m.id);

async function main() {
  // 1 — result shape.
  reset();
  script(reply('We were hoping you could take a look.'));
  let r = await run('grammar', 'we was hoping you could took a look.');
  check('runAction resolves to { text, via: "gemini" }',
    r.value && r.value.text === 'We were hoping you could take a look.' && r.value.via === 'gemini',
    `got ${JSON.stringify(r.value ?? r.error?.message)}`);
  check('a successful action clears its deadline timer', H.pendingTimers() === 0, `pending = ${H.pendingTimers()}`);

  // 2 — the 20 s hard stop is one budget for the whole action, not one per
  // thinking-variant attempt. Three variants are rejected (5 s each), then the
  // fourth request hangs: the action must abort at 20 s from the start, not at
  // 15 s + a fresh timeout.
  reset();
  const invalid = () => http(400, { error: { message: 'Unknown name "thinkingLevel"' } });
  script(after(5000, invalid()), after(5000, invalid()), after(5000, invalid()), never());
  let outcome = null;
  const pending = runAction('grammar', 'hello there', SETTINGS).then(
    (value) => { outcome = { value }; },
    (error) => { outcome = { error }; }
  );
  await H.advance(19999);
  check('never-resolving fetch → still pending at 19.999 s', outcome === null,
    `outcome = ${JSON.stringify(outcome?.error?.code ?? outcome?.value)}`);
  await H.advance(1);
  const settledAt20 = outcome !== null;
  if (!settledAt20) await H.advance(600000); // let a wrong (longer) timeout fire so the harness still finishes
  await pending;
  check('never-resolving fetch → TIMEOUT at 20 s of fake time, after 3 variant attempts',
    settledAt20 && outcome?.error instanceof AiError && outcome.error.code === 'TIMEOUT' && window.__fetches.length === 4,
    `settled at 20 s = ${settledAt20}, code = ${outcome?.error?.code}, fetches = ${window.__fetches.length}`);
  check('TIMEOUT message is worded for the user',
    /took too long/i.test(outcome?.error?.message || '') && !/gemini/i.test(outcome?.error?.message || ''),
    `message = ${JSON.stringify(outcome?.error?.message)}`);
  check('TIMEOUT leaves no timer behind', H.pendingTimers() === 0, `pending = ${H.pendingTimers()}`);

  // 3 — headers arrive but the body never finishes: still TIMEOUT, not a
  // misreported empty response.
  reset();
  script((_url, init) => Promise.resolve({
    ok: true,
    status: 200,
    json: () => new Promise((_, reject) => init.signal.addEventListener('abort', () => reject(abortError())))
  }));
  r = await run('grammar', 'hello there');
  check('body that never finishes → TIMEOUT at 20 s', r.error?.code === 'TIMEOUT',
    `got ${r.error?.code}: ${r.error?.message}`);

  /** Script the responses, run one grammar action, and expect an AiError with `code`. */
  async function expectError(name, responses, code, { text = 'some text', settings = SETTINGS, fetches } = {}) {
    reset();
    script(...responses);
    const out = await run('grammar', text, settings);
    const err = out.error;
    const pass = err instanceof AiError && err.code === code &&
      (fetches === undefined || window.__fetches.length === fetches);
    check(name, pass,
      `got ${err ? `${err.code}: ${err.message}` : JSON.stringify(out.value)}; fetches = ${window.__fetches.length}`);
    return err;
  }

  // 4 — HTTP status → error code, unchanged from before this harness existed.
  await expectError('400 mentioning the API key → BAD_KEY, no retry',
    [http(400, { error: { message: 'API key not valid. Please pass a valid API key.' } })], 'BAD_KEY', { fetches: 1 });
  await expectError('400 for anything else → INVALID_ARGUMENT after every variant is tried',
    Array(6).fill(0).map(() => http(400, { error: { message: 'Unknown name "thinkingLevel"' } })), 'INVALID_ARGUMENT', { fetches: 6 });
  await expectError('401 → BAD_KEY', [http(401, {})], 'BAD_KEY', { fetches: 1 });
  await expectError('403 → BAD_KEY', [http(403, { error: { message: 'PERMISSION_DENIED' } })], 'BAD_KEY', { fetches: 1 });
  // A 404 also triggers the one list refresh of the self-heal (section 17); with
  // no list to be had, the original code surfaces.
  await expectError('404 → BAD_MODEL (after the one list refresh)',
    [http(404, { error: { message: 'model not found' } }), http(500)], 'BAD_MODEL', { fetches: 2 });
  await expectError('429 → RATE_LIMIT', [http(429, { error: { message: 'quota' } })], 'RATE_LIMIT', { fetches: 1 });
  await expectError('500 → SERVER', [http(500)], 'SERVER', { fetches: 1 });
  await expectError('503 → SERVER', [http(503, { error: { message: 'overloaded' } })], 'SERVER', { fetches: 1 });
  await expectError('418 (unmapped) → HTTP_418', [http(418, {})], 'HTTP_418', { fetches: 1 });
  await expectError('fetch throws → NETWORK, no retry', [after(0, networkFailure())], 'NETWORK', { fetches: 1 });
  check('a failed action clears its deadline timer', H.pendingTimers() === 0, `pending = ${H.pendingTimers()}`);

  // 5 — 200 responses that are not usable.
  await expectError('promptFeedback.blockReason → BLOCKED',
    [http(200, { promptFeedback: { blockReason: 'SAFETY' }, candidates: [] })], 'BLOCKED');
  await expectError('finishReason SAFETY → BLOCKED', [reply('partial', { finishReason: 'SAFETY' })], 'BLOCKED');
  await expectError('finishReason PROHIBITED_CONTENT → BLOCKED', [reply('partial', { finishReason: 'PROHIBITED_CONTENT' })], 'BLOCKED');
  const truncated = await expectError('finishReason MAX_TOKENS with text → TRUNCATED',
    [reply('cut off mid', { finishReason: 'MAX_TOKENS' })], 'TRUNCATED');
  check('TRUNCATED with text explains the selection is too long', /too long/.test(truncated?.message || ''), truncated?.message);
  const thoughtOut = await expectError('finishReason MAX_TOKENS with no text → TRUNCATED',
    [http(200, { candidates: [{ content: { parts: [] }, finishReason: 'MAX_TOKENS' }] })], 'TRUNCATED');
  check('TRUNCATED with no text blames the thinking budget', /thinking/.test(thoughtOut?.message || ''), thoughtOut?.message);
  await expectError('no candidates → EMPTY_RESPONSE', [http(200, { candidates: [] })], 'EMPTY_RESPONSE');
  await expectError('non-JSON 200 body → EMPTY_RESPONSE', [http(200)], 'EMPTY_RESPONSE');
  await expectError('candidate with only whitespace → EMPTY_RESPONSE', [reply('  \n ')], 'EMPTY_RESPONSE');

  // 6 — pre-checks that never reach the network.
  await expectError('no API key → NO_API_KEY, nothing fetched', [reply('x')], 'NO_API_KEY',
    { settings: { ...SETTINGS, apiKey: '' }, fetches: 0 });
  await expectError('empty text → EMPTY, nothing fetched', [reply('x')], 'EMPTY', { text: '   \n', fetches: 0 });
  await expectError('text over MAX_CHARS → TOO_LONG, nothing fetched', [reply('x')], 'TOO_LONG',
    { text: 'a'.repeat(MAX_CHARS + 1), fetches: 0 });
  reset();
  script(reply('ok'));
  r = await run('grammar', 'a'.repeat(MAX_CHARS));
  check('text exactly MAX_CHARS is sent', r.value?.text === 'ok' && window.__fetches.length === 1, JSON.stringify(r.error?.code));

  // 7 — what is sent.
  reset();
  script(reply('ok'));
  r = await run('translate', 'hello', { ...SETTINGS, model: 'gemini-x/y', apiKey: 'KEY-123', targetLanguage: 'French' });
  const sent = window.__fetches[0];
  check('request goes to the model in settings, URL-encoded',
    sent?.url === 'https://generativelanguage.googleapis.com/v1beta/models/gemini-x%2Fy:generateContent', sent?.url);
  check('key travels in the x-goog-api-key header, not the URL',
    sent?.headers['x-goog-api-key'] === 'KEY-123' && !sent.url.includes('KEY-123'), JSON.stringify(sent?.headers));
  check('the selection is the only user content, fenced by the sentinels',
    sent?.body?.contents?.length === 1 && sent.body.contents[0].parts[0].text.includes('<<<TEXT\nhello\nTEXT>>>'),
    JSON.stringify(sent?.body?.contents));
  check('translate builds a system instruction naming the target language',
    /French/.test(sent?.body?.systemInstruction?.parts?.[0]?.text || ''));
  check('translate uses the lower temperature', sent?.body?.generationConfig?.temperature === 0.2,
    JSON.stringify(sent?.body?.generationConfig));

  // 8 — thought parts never reach the document.
  reset();
  script(http(200, { candidates: [{ content: { parts: [
    { thought: true, text: 'Let me reason about this…' }, { text: 'Clean answer' }
  ] }, finishReason: 'STOP' }] }));
  r = await run('grammar', 'dirty answer');
  check('parts flagged thought are filtered out', r.value?.text === 'Clean answer', JSON.stringify(r.value ?? r.error?.message));

  // 9 — output cleanup.
  async function cleaned(raw, original) {
    reset();
    script(reply(raw));
    const out = await run('grammar', original);
    return out.value?.text ?? `ERROR ${out.error?.code}`;
  }
  check('markdown fence around the whole reply is stripped',
    (await cleaned('```text\nfixed text\n```', 'fixd text')) === 'fixed text');
  check('fence is kept when the original contained one',
    (await cleaned('```\ncode\n```', 'some ```code``` here')) === '```\ncode\n```');
  check('matching double quotes are stripped when the original had none',
    (await cleaned('"fixed text"', 'fixd text')) === 'fixed text');
  check('curly quotes are stripped too',
    (await cleaned('“fixed text”', 'fixd text')) === 'fixed text');
  check('quotes are kept when the original started with one',
    (await cleaned('"fixed text"', '"fixd text"')) === '"fixed text"');
  check('echoed sentinels are stripped',
    (await cleaned('<<<TEXT\nfixed text\nTEXT>>>', 'fixd text')) === 'fixed text');
  check('CRLF is normalised and the result trimmed',
    (await cleaned('  line one\r\nline two \n', 'l1 l2')) === 'line one\nline two');

  // 10 — thinking-variant discovery: cheapest first, remembered, remembered goes first.
  reset();
  script(http(400, { error: { message: 'Unknown name "thinkingLevel"' } }), reply('ok'));
  r = await run('grammar', 'text');
  check('first attempt asks for thinkingLevel: minimal',
    window.__fetches[0]?.body?.generationConfig?.thinkingConfig?.thinkingLevel === 'minimal',
    JSON.stringify(window.__fetches[0]?.body?.generationConfig));
  check('an INVALID_ARGUMENT retries with the next variant and succeeds',
    r.value?.text === 'ok' && window.__fetches[1]?.body?.generationConfig?.thinkingConfig?.thinkingLevel === 'MINIMAL',
    JSON.stringify(window.__fetches[1]?.body?.generationConfig));
  check('the variant that worked is remembered for this model in storage',
    window.__storage.thinkingVariants?.[SETTINGS.model] === 'LEVEL-MINIMAL', JSON.stringify(window.__storage));

  reset();
  window.__storage = { thinkingVariants: { [SETTINGS.model]: 'budget-0' } };
  script(reply('ok'));
  r = await run('grammar', 'text');
  check('the remembered variant is tried first',
    window.__fetches.length === 1 && window.__fetches[0]?.body?.generationConfig?.thinkingConfig?.thinkingBudget === 0,
    JSON.stringify(window.__fetches[0]?.body?.generationConfig));

  reset();
  window.__storage = { thinkingVariants: { [SETTINGS.model]: 'none' } };
  script(reply('ok'));
  r = await run('grammar', 'text');
  check('remembered "none" sends no thinkingConfig at all',
    window.__fetches.length === 1 && !('thinkingConfig' in window.__fetches[0].body.generationConfig),
    JSON.stringify(window.__fetches[0]?.body?.generationConfig));

  reset();
  window.__storage = { thinkingVariants: { [SETTINGS.model]: 'budget-0' } };
  script(http(400, { error: { message: 'nope' } }), reply('ok'));
  r = await run('grammar', 'text');
  check('a rejected remembered variant falls back to the cheapest-first order',
    window.__fetches[1]?.body?.generationConfig?.thinkingConfig?.thinkingLevel === 'minimal' &&
    window.__storage.thinkingVariants[SETTINGS.model] === 'level-minimal',
    JSON.stringify(window.__fetches[1]?.body?.generationConfig) + ' ' + JSON.stringify(window.__storage));

  // 11 — settings schema: the provider seam's new fields have defaults.
  reset();
  const s = await getSettings();
  check('getSettings() returns provider: "gemini" when unset', s.provider === 'gemini', `provider = ${JSON.stringify(s.provider)}`);
  check('getSettings() returns onDeviceTranslate: false when unset', s.onDeviceTranslate === false,
    `onDeviceTranslate = ${JSON.stringify(s.onDeviceTranslate)}`);
  check('getSettings() returns onDeviceConsentedPairs: [] when unset',
    Array.isArray(s.onDeviceConsentedPairs) && s.onDeviceConsentedPairs.length === 0,
    `onDeviceConsentedPairs = ${JSON.stringify(s.onDeviceConsentedPairs)}`);
  reset();
  window.__storage = { provider: 'gemini', onDeviceTranslate: true };
  check('getSettings() returns a stored onDeviceTranslate', (await getSettings()).onDeviceTranslate === true);
  reset();
  window.__storage = { onDeviceConsentedPairs: ['English>Arabic'] };
  check('getSettings() returns a stored onDeviceConsentedPairs',
    JSON.stringify((await getSettings()).onDeviceConsentedPairs) === JSON.stringify(['English>Arabic']));

  // 12 — the live model list: the Flash family only (no Pro, no preview, no
  // niche modalities), Flash first, newest generation floating up, the
  // recommended one marked. A fix/translate tool has no business listing
  // anything outside "generic, fast, cheap, currently supported" (see the
  // comment on FLASH_FAMILY in lib/ai.js for why this is an allowlist).
  const LIVE = [
    gm('embedding-001', 'Embedding 001', ['embedContent']),
    gm('gemini-3.1-pro-preview', 'Gemini 3.1 Pro Preview'),
    gm('gemini-3.6-flash', 'Gemini 3.6 Flash'),
    gm('imagen-4', 'Imagen 4', ['predict']),
    gm('gemini-3.8-flash', 'Gemini 3.8 Flash'),
    gm('gemini-3.5-flash-lite', 'Gemini 3.5 Flash-Lite'),
    gm('gemini-3.2-pro', 'Gemini 3.2 Pro'),
    gm('aqa', 'Model that performs Attributed Question Answering', ['generateAnswer'])
  ];
  reset();
  script(modelsPage(LIVE));
  r = await list();
  check('listModels keeps only the Flash family — Pro, Pro Preview, embeddings, images and AQA all dropped',
    JSON.stringify(ids(r.value?.models)) === JSON.stringify([
      'gemini-3.8-flash', 'gemini-3.6-flash', 'gemini-3.5-flash-lite'

  check('translate + on-device on + pair available → { via: "on-device" }, no fetch',
    r.value?.via === 'on-device' && r.value.text === '[en→ar] hello there' && window.__fetches.length === 0,
    `got ${JSON.stringify(r.value ?? r.error?.code + ': ' + r.error?.message)}, fetches = ${window.__fetches.length}`);

  /** Run a translate with on-device on and expect the Gemini route: one fetch, via 'gemini'. */
  async function expectGemini(name, { action = 'translate', settings = ON, text = 'hello there' } = {}) {
    script(reply('from gemini'));
    const out = await run(action, text, settings);
    check(name, out.value?.via === 'gemini' && out.value.text === 'from gemini' && window.__fetches.length === 1,
      `got ${JSON.stringify(out.value ?? out.error?.code + ': ' + out.error?.message)}, fetches = ${window.__fetches.length}`);
    return out;
  }

  reset();
  od = onDevice({ translator: 'unavailable' });
  await expectGemini('pair unavailable → Gemini, via "gemini"');
  check('an unavailable pair never creates a translator', od.creates.length === 0, JSON.stringify(od.creates));

  // A pair the toggle was turned on for can stop being offered later purely
  // because the user changed the target/secondary language on the options
  // page in between — runAction does not know or care why availability()
  // says 'unavailable', so the same silent Gemini fallback applies mid-action
  // with no prompt (#10's acceptance criterion; the mechanism is identical to
  // the case above, this just names the scenario explicitly).
  reset();
  od = onDevice({ translator: 'unavailable' });
  await expectGemini('pair made unavailable by a language change since the toggle was turned on → Gemini mid-action, no prompt',
    { settings: { ...ON, targetLanguage: 'French', secondaryLanguage: 'Welsh' } });
  check('the language-change case never creates a translator either', od.creates.length === 0, JSON.stringify(od.creates));
  reset();
  onDevice({ translator: 'downloadable' });
  await expectGemini('pair downloadable (not yet downloaded) → Gemini, no surprise download');
  reset();
  onDevice({ translator: 'absent' });
  await expectGemini('Translator absent → Gemini');
  reset();
  onDevice({ translate: () => { throw new Error('model crashed'); } });
  await expectGemini('on-device call throws → Gemini fallback');
  reset();
  onDevice({ translator: () => { throw new Error('availability crashed'); } });
  await expectGemini('availability() throwing → Gemini fallback');
  reset();
  onDevice({ translate: () => '   ' });
  await expectGemini('an empty on-device result → Gemini fallback');
  reset();
  od = onDevice();
  await expectGemini('grammar + on-device on → Gemini', { action: 'grammar' });
  check('grammar never touches the built-in Translator', od.creates.length === 0 && od.detects.length === 0, JSON.stringify(od));
  reset();
  od = onDevice();
  await expectGemini('translate + on-device off → Gemini even when the pair is available', { settings: { ...ON, onDeviceTranslate: false } });
  check('the toggle off never touches the built-in Translator', od.creates.length === 0 && od.detects.length === 0, JSON.stringify(od));

  // 22 — a translate-only user needs no key: the route is decided before the
  // key check. Grammar still needs one.
  const NO_KEY_ON = { ...ON, apiKey: '' };
  reset();
  onDevice();
  script(reply('should not be used'));
  r = await run('translate', 'hello there', NO_KEY_ON);
  check('no key + on-device on + translate + pair available → on-device result, no fetch, no NO_API_KEY',
    r.value?.via === 'on-device' && r.value.text === '[en→ar] hello there' && window.__fetches.length === 0,
    `got ${JSON.stringify(r.value ?? r.error?.code + ': ' + r.error?.message)}, fetches = ${window.__fetches.length}`);
  reset();
  onDevice();
  script(reply('x'));
  r = await run('grammar', 'hello there', NO_KEY_ON);
  check('no key + on-device on + grammar → NO_API_KEY, nothing fetched',
    r.error?.code === 'NO_API_KEY' && window.__fetches.length === 0,
    `got ${JSON.stringify(r.value ?? r.error?.code)}, fetches = ${window.__fetches.length}`);
  reset();
  onDevice({ translator: 'unavailable' });
  script(reply('x'));
  r = await run('translate', 'hello there', NO_KEY_ON);
  check('no key + on-device on + translate + pair unavailable → NO_API_KEY (the Gemini fallback needs a key)',
    r.error?.code === 'NO_API_KEY' && window.__fetches.length === 0,
    `got ${JSON.stringify(r.value ?? r.error?.code)}, fetches = ${window.__fetches.length}`);

  // 23 — auto-swap on this route mirrors the Gemini prompt's rule, using the
  // LanguageDetector on the selection; without a detector the source is
  // assumed to be the secondary language.
  const pair = () => od.creates.map((c) => `${c.sourceLanguage}→${c.targetLanguage}`).join();
  reset();
  od = onDevice({ detected: 'ar' });
  r = await run('translate', 'مرحبا', ON);
  check('detected language == target + auto-swap on → translated to the secondary language (ar→en)',
    r.value?.via === 'on-device' && pair() === 'ar→en' && od.detects[0] === 'مرحبا',
    `creates = ${pair()}, detects = ${JSON.stringify(od.detects)}, got ${JSON.stringify(r.value ?? r.error?.code)}`);
  reset();
  od = onDevice({ detected: 'ar' });
  r = await run('translate', 'مرحبا', { ...ON, autoSwapLanguage: false });
  check('detected language == target + auto-swap off → still asks for the target (ar→ar)',
    r.value?.via === 'on-device' && pair() === 'ar→ar', `creates = ${pair()}, got ${JSON.stringify(r.value ?? r.error?.code)}`);
  reset();
  od = onDevice({ detected: 'fr' });
  r = await run('translate', 'bonjour', ON);
  check('a detected language that is neither target nor secondary is the source (fr→ar)',
    r.value?.via === 'on-device' && pair() === 'fr→ar', `creates = ${pair()}`);
  reset();
  od = onDevice({ detector: 'absent' });
  r = await run('translate', 'hello there', ON);
  check('LanguageDetector absent → source assumed to be the secondary language (en→ar)',
    r.value?.via === 'on-device' && pair() === 'en→ar' && od.detects.length === 0, `creates = ${pair()}`);
  reset();
  od = onDevice({ detector: 'downloadable' });
  r = await run('translate', 'hello there', ON);
  check('LanguageDetector not downloaded → no surprise download, source assumed secondary (en→ar)',
    r.value?.via === 'on-device' && pair() === 'en→ar' && od.detects.length === 0, `creates = ${pair()}`);
  reset();
  od = onDevice({ detected: 'und' });
  r = await run('translate', '12345', ON);
  check('an undetermined detection ("und") → source assumed secondary (en→ar)',
    r.value?.via === 'on-device' && pair() === 'en→ar', `creates = ${pair()}`);
  reset();
  od = onDevice({ detected: 'zh-Hant' });
  r = await run('translate', '你好', { ...ON, targetLanguage: 'Chinese (Simplified)', secondaryLanguage: 'English' });
  check('detected zh-Hant counts as already in Chinese (Simplified): swap to the secondary (zh-Hant→en)',
    r.value?.via === 'on-device' && pair() === 'zh-Hant→en', `creates = ${pair()}`);
  reset();
  od = onDevice({ detected: 'en' });
  r = await run('translate', 'hello', { ...ON, targetLanguage: 'Portuguese (Brazil)', secondaryLanguage: 'Chinese (Traditional)' });
  check('display names map to BCP-47 for the pair (en→pt-BR)',
    r.value?.via === 'on-device' && pair() === 'en→pt-BR', `creates = ${pair()}`);
  reset();
  od = onDevice();
  script(reply('from gemini'));
  r = await run('translate', 'hello', { ...ON, targetLanguage: 'Klingon' });
  check('a language name the table does not know → Gemini, nothing created',
    r.value?.via === 'gemini' && od.creates.length === 0, `creates = ${pair()}, got ${JSON.stringify(r.value ?? r.error?.code)}`);

  // 24 — the on-device route obeys the same 20 s hard stop, on the same
  // deadline: a stalled local model is TIMEOUT, not a fresh Gemini budget.
  /** Drive runAction to 20 s of fake time; returns { pendingAt19999, settledAt20, outcome }. */
  async function driveToDeadline(action, text, settings) {
    let outcome = null;
    const p = runAction(action, text, settings).then(
      (value) => { outcome = { value }; },
      (error) => { outcome = { error }; }
    );
    await H.advance(19999);
    const pendingAt19999 = outcome === null;
    await H.advance(1);
    const settledAt20 = outcome !== null;
    if (!settledAt20) await H.advance(600000);
    await p;
    return { pendingAt19999, settledAt20, outcome };
  }
  const settleAt = (ms, value) => () => new Promise((resolve, reject) => setTimeout(() => (value instanceof Error ? reject(value) : resolve(value)), ms));

  reset();
  od = onDevice({ translate: () => new Promise(() => {}) }); // hangs, ignores the signal
  script(reply('should not be used'));
  let dl = await driveToDeadline('translate', 'hello there', ON);
  check('on-device translate that hangs → TIMEOUT at exactly 20 s, no Gemini call',
    dl.pendingAt19999 && dl.settledAt20 && dl.outcome?.error?.code === 'TIMEOUT' && window.__fetches.length === 0,
    `pending at 19.999 s = ${dl.pendingAt19999}, settled at 20 s = ${dl.settledAt20}, got ${JSON.stringify(dl.outcome?.value ?? dl.outcome?.error?.code)}, fetches = ${window.__fetches.length}`);
  check('the deadline signal is handed to translate()', od.translates[0]?.signal instanceof AbortSignal && od.translates[0].signal.aborted === true,
    JSON.stringify(od.translates[0]));
  check('a timed-out on-device action leaves no timer behind', H.pendingTimers() === 0, `pending = ${H.pendingTimers()}`);

  reset();
  od = onDevice({ translate: (_t, _o) => new Promise((_, reject) => setTimeout(() => reject(new DOMException('aborted', 'AbortError')), 20000)) });
  script(reply('should not be used'));
  dl = await driveToDeadline('translate', 'hello there', ON);
  check('an on-device call that rejects on abort → TIMEOUT, not a Gemini fallback',
    dl.settledAt20 && dl.outcome?.error?.code === 'TIMEOUT' && window.__fetches.length === 0,
    `got ${JSON.stringify(dl.outcome?.value ?? dl.outcome?.error?.code)}, fetches = ${window.__fetches.length}`);

  reset();
  od = onDevice({ translate: settleAt(15000, new Error('model crashed late')) });
  script(never());
  dl = await driveToDeadline('translate', 'hello there', ON);
  check('on-device failing at 15 s → Gemini fallback gets the remaining 5 s: TIMEOUT at 20 s of the action',
    dl.pendingAt19999 && dl.settledAt20 && dl.outcome?.error?.code === 'TIMEOUT' && window.__fetches.length === 1,
    `pending at 19.999 s = ${dl.pendingAt19999}, settled at 20 s = ${dl.settledAt20}, got ${JSON.stringify(dl.outcome?.value ?? dl.outcome?.error?.code)}, fetches = ${window.__fetches.length}`);

  reset();
  od = onDevice({ translate: settleAt(3000, 'slow but fine') });
  r = await run('translate', 'hello there', ON);
  check('an on-device translate that takes 3 s is returned as normal', r.value?.via === 'on-device' && r.value.text === 'slow but fine',
    JSON.stringify(r.value ?? r.error?.code));
  check('a successful on-device action leaves no timer behind and destroys its translator', H.pendingTimers() === 0 && od.destroyed === 1,
    `pending = ${H.pendingTimers()}, destroyed = ${od.destroyed}`);

  // 25 — the BAD_MODEL heal is a Gemini concern: on the on-device path a
  // saved model that Gemini would reject is never even sent, so nothing is
  // refreshed or rewritten in storage.
  reset();
  window.__storage = { model: 'gemini-retired', modelCache: null };
  od = onDevice();
  script(http(404, { error: { message: 'model not found' } }), modelsPage(LIVE), reply('healed'));
  r = await run('translate', 'hello there', { ...ON, model: 'gemini-retired' });
  check('BAD_MODEL heal never runs on the on-device path: no fetch, model setting untouched',
    r.value?.via === 'on-device' && window.__fetches.length === 0 && window.__storage.model === 'gemini-retired' && !window.__storage.modelCache,
    `got ${JSON.stringify(r.value ?? r.error?.code)}, fetches = ${window.__fetches.length}, storage = ${JSON.stringify(window.__storage)}`);

  // 26 — feature detection for the options page: is the API there, is the
  // pair offered, does it need a download — each "no" with a reason a person
  // can read. `supported` means the toggle may be turned on (now, or after
  // the download the reason describes).
  const PAIR = { sourceLanguage: 'English', targetLanguage: 'Arabic' };
  const status = (o = PAIR) => onDeviceStatus(o);
  const shape = (s) => s && typeof s.supported === 'boolean' && typeof s.availability === 'string' && (s.reason === null || typeof s.reason === 'string');

  reset();
  let st = await status();
  check('onDeviceStatus with no Translator → { supported: false, availability: "absent", reason }',
    shape(st) && st.supported === false && st.availability === 'absent' && /Translator|browser/i.test(st.reason || ''), JSON.stringify(st));
  const absentReason = st?.reason;

  reset();
  let asked = null;
  onDevice({ translator: (opts) => { asked = opts; return 'available'; } });
  st = await status();
  check('onDeviceStatus with the pair available → { supported: true, availability: "available", reason: null }',
    shape(st) && st.supported === true && st.availability === 'available' && st.reason === null, JSON.stringify(st));
  check('onDeviceStatus asks the Translator for the BCP-47 pair, secondary → target',
    asked?.sourceLanguage === 'en' && asked?.targetLanguage === 'ar', JSON.stringify(asked));

  reset();
  onDevice({ translator: 'downloadable' });
  st = await status();
  check('onDeviceStatus with a downloadable pair → { supported: true, availability: "downloadable" } and a reason that says a download is needed',
    shape(st) && st.supported === true && st.availability === 'downloadable' && /download/i.test(st.reason || '') && /Arabic/.test(st.reason || ''), JSON.stringify(st));

  reset();
  onDevice({ translator: 'downloading' });
  st = await status();
  check('onDeviceStatus while downloading → { supported: true, availability: "downloading" } with a reason',
    shape(st) && st.supported === true && st.availability === 'downloading' && /download/i.test(st.reason || ''), JSON.stringify(st));

  reset();
  onDevice({ translator: 'unavailable' });
  st = await status();
  check('onDeviceStatus with an unavailable pair → { supported: false, availability: "unavailable" } and a reason that names the pair and admits it cannot tell hardware from an unsupported pair',
    shape(st) && st.supported === false && st.availability === 'unavailable' && /English/.test(st.reason || '') && /Arabic/.test(st.reason || '') && /hardware|machine/i.test(st.reason || ''),
    JSON.stringify(st));

  reset();
  onDevice({ translator: () => { throw new Error('boom'); } });
  st = await status();
  check('onDeviceStatus when availability() throws → unavailable with a reason, never a rejection',
    shape(st) && st.supported === false && st.availability === 'unavailable' && st.reason, JSON.stringify(st));

  reset();
  onDevice();
  st = await status({ sourceLanguage: 'English', targetLanguage: 'Klingon' });
  check('onDeviceStatus for a language the table does not know → unavailable, the reason names it',
    shape(st) && st.supported === false && st.availability === 'unavailable' && /Klingon/.test(st.reason || ''), JSON.stringify(st));

  // The offscreen bridge (lib/on-device-offscreen.js) answers 'absent' when the
  // document on the other side has no Translator either: same result as no API.
  reset();
  onDevice({ translator: () => 'absent' });
  st = await status();
  check('onDeviceStatus when the bridge answers "absent" → the same result as no API at all',
    shape(st) && st.supported === false && st.availability === 'absent' && st.reason === absentReason, JSON.stringify(st));

  reset();
  onDevice({ translator: 'something-new' });
  st = await status();
  check('onDeviceStatus passes an availability value it does not know through as unsupported, with a reason',
    shape(st) && st.supported === false && st.availability === 'something-new' && st.reason, JSON.stringify(st));

  // 27 — the BCP-47 table covers every language the picker offers, and only those.
  const missing = LANGUAGES.filter((l) => typeof LANGUAGE_CODES[l] !== 'string' || !/^[a-z]{2,3}(-[A-Za-z]{2,4})?$/.test(LANGUAGE_CODES[l]));
  check('LANGUAGE_CODES has a BCP-47 tag for every LANGUAGES entry', missing.length === 0, `missing/bad: ${JSON.stringify(missing)}`);
  const extra = Object.keys(LANGUAGE_CODES).filter((l) => !LANGUAGES.includes(l));
  check('LANGUAGE_CODES has no entry LANGUAGES does not list', extra.length === 0, `extra: ${JSON.stringify(extra)}`);
  const dup = Object.values(LANGUAGE_CODES).filter((c, i, a) => a.indexOf(c) !== i);
  check('no two languages share a tag', dup.length === 0, `duplicates: ${JSON.stringify(dup)}`);

  // 28 — download consent (#10): the pure pair-membership helpers the options
  // page uses to decide whether to ask again, and downloadOnDeviceLanguage,
  // the function it calls directly (no background/offscreen round trip — see
  // its doc comment in lib/on-device.js) when the answer is yes.
  const enAr = { sourceLanguage: 'English', targetLanguage: 'Arabic' };
  check('pairKey joins source and target display names with ">"',
    pairKey(enAr) === 'English>Arabic', pairKey(enAr));
  check('hasConsent is false for an empty list', hasConsent([], enAr) === false);
  check('hasConsent is false when only a different pair is listed',
    hasConsent(['French>Arabic'], enAr) === false);
  check('hasConsent is true once the pair\'s key is present',
    hasConsent(['English>Arabic'], enAr) === true);
  check('addConsent adds the pair to an empty list',
    JSON.stringify(addConsent([], enAr)) === JSON.stringify(['English>Arabic']));
  check('addConsent keeps other pairs and appends the new one',
    JSON.stringify(addConsent(['French>Arabic'], enAr)) === JSON.stringify(['French>Arabic', 'English>Arabic']));
  check('addConsent is idempotent for a pair already consented',
    addConsent(['English>Arabic'], enAr).length === 1);

  reset();
  onDevice({
    create: async (opts, rec) => {
      rec.creates.push({ sourceLanguage: opts.sourceLanguage, targetLanguage: opts.targetLanguage });
      const listeners = [];
      opts.monitor?.({ addEventListener: (evt, fn) => { if (evt === 'downloadprogress') listeners.push(fn); } });
      listeners.forEach((fn) => fn({ loaded: 0.4 }));
      listeners.forEach((fn) => fn({ loaded: 1 }));
      return { destroy: () => { rec.destroyed++; } };
    }
  });
  const progressed = [];
  await downloadOnDeviceLanguage({ sourceLanguage: 'English', targetLanguage: 'Arabic' }, { onProgress: (l) => progressed.push(l) });
  check('downloadOnDeviceLanguage forwards downloadprogress fractions, in order, via onProgress',
    JSON.stringify(progressed) === JSON.stringify([0.4, 1]), JSON.stringify(progressed));

  reset();
  const rec = onDevice(); // the default stub: create() resolves at once, never calling monitor — the already-available case
  await downloadOnDeviceLanguage({ sourceLanguage: 'English', targetLanguage: 'Arabic' });
  check('downloadOnDeviceLanguage resolves and destroys the translator when nothing needed downloading',
    rec.destroyed === 1, `destroyed = ${rec.destroyed}`);

  reset();
  onDevice({
    create: (opts) => new Promise((_, reject) => {
      opts.signal?.addEventListener('abort', () => reject(abortError()));
      // never resolves on its own — only Cancel (the signal) ends this one.
    })
  });
  const ac = new AbortController();
  const dlPending = downloadOnDeviceLanguage({ sourceLanguage: 'English', targetLanguage: 'Arabic' }, { signal: ac.signal });
  ac.abort();
  let downloadErr = null;
  try { await dlPending; } catch (e) { downloadErr = e; }
  check('downloadOnDeviceLanguage rejects with an AbortError when the signal aborts mid-download',
    downloadErr?.name === 'AbortError', String(downloadErr));

  reset();
  onDevice({ translator: 'absent' });
  downloadErr = null;
  try { await downloadOnDeviceLanguage({ sourceLanguage: 'English', targetLanguage: 'Arabic' }); } catch (e) { downloadErr = e; }
  check('downloadOnDeviceLanguage with no Translator throws a plain (non-abort) error',
    downloadErr && downloadErr.name !== 'AbortError' && /Translator/i.test(downloadErr.message), String(downloadErr));

  reset();
  onDevice();
  downloadErr = null;
  try { await downloadOnDeviceLanguage({ sourceLanguage: 'English', targetLanguage: 'Klingon' }); } catch (e) { downloadErr = e; }
  check('downloadOnDeviceLanguage with a language Kalima has no BCP-47 code for throws naming it',
    /Klingon/.test(downloadErr?.message || ''), String(downloadErr));

  const failed = results.filter((x) => x.startsWith('FAIL')).length;
  document.getElementById('out').textContent =
    results.join('\n') + `\n\n${results.length - failed}/${results.length} passed` +
    (failed ? `  — ${failed} FAILED` : '  — all good');
  document.title = failed ? `FAILED ${failed}` : 'ALL PASS';
}

main().catch((err) => {
  document.getElementById('out').textContent =
    'harness crashed: ' + err.message + '\n' + err.stack + '\n\n' + results.join('\n');
  document.title = 'HARNESS CRASH';
});
</script>
</body>
</html>
